<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>自然發音護照</title>
<style>
:root{
  --blue:#4361EE; --teal:#2EC4B6; --ink:#233047; --sub:#8592A6;
  --bg:#F6F8FC; --card:#ffffff; --border:#E4E8F0; --track:#EEF1F7;
  --green:#06D6A0; --amber:#FFB703; --red:#EF476F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.header{
  background:linear-gradient(135deg,#4361EE 0%,#2EC4B6 100%);
  color:#fff;padding:22px 20px 26px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;
  box-shadow:0 8px 24px rgba(67,97,238,.25);
  position:relative;
}
.appSwitchGroup{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.appSwitch{background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;}
.htag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;margin-bottom:8px;}
.htitle{font-weight:800;font-size:24px;letter-spacing:.3px;}
.hsub{font-size:13px;opacity:.9;margin-top:3px;font-weight:600;}
.body{flex:1;overflow-y:auto;padding-bottom:84px;}
.pad{padding:16px 18px 6px;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(35,48,71,.06);z-index:40;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;position:relative;color:#8592A6;}
.tabbtn.active{color:var(--blue);}
.tabbtn .emo{font-size:20px;}
.tabbtn .lbl{font-size:11px;font-weight:800;margin-top:2px;}
.tabbtn .dot{position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:90%;text-align:center;}
.card{background:#fff;border-radius:16px;}
.sectionTitle{font-weight:800;font-size:15px;margin:16px 0 10px;}
.speakBtn{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#EEF1FB;color:var(--blue);}
/* mascot */
.mascotWrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;}
.owl{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 6px 14px rgba(35,48,71,.1);}
.bubble{flex:1;background:#fff;border-radius:16px;padding:10px 14px;font-size:12.5px;font-weight:700;color:#4A5568;box-shadow:0 6px 14px rgba(35,48,71,.06);}
.streakBadge{position:absolute;top:-8px;right:-4px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;box-shadow:0 4px 10px rgba(255,183,3,.4);}
/* daily goal */
.dailyCard{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px;}
.dailyTop{display:flex;justify-content:space-between;margin-bottom:7px;}
.barTrack{height:7px;background:var(--track);border-radius:999px;overflow:hidden;}
.barFill{height:100%;border-radius:999px;transition:width .4s ease;}
.dailyStreakRow{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--sub);}
/* word of day */
.wodCard{border-radius:18px;padding:14px 16px;color:#fff;margin-bottom:18px;box-shadow:0 10px 22px rgba(35,48,71,.14);}
.wodLabel{font-size:11px;font-weight:800;opacity:.9;margin-bottom:6px;}
.wodRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.wodEn{font-weight:800;font-size:24px;word-break:break-word;}
.wodZh{font-size:12.5px;opacity:.92;margin-top:3px;font-weight:700;}
.wodFooter{font-size:11px;opacity:.85;margin-top:10px;font-weight:700;}
/* badges */
.badgeGrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.badge{width:78px;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 4px 10px rgba(35,48,71,.06);}
.badge.locked{opacity:.5;}
.badge .emo{font-size:22px;margin-bottom:3px;}
.badge .lbl{font-size:9.5px;font-weight:800;color:#5B6779;line-height:1.2;}
/* ring */
.ring{position:relative;width:132px;height:132px;margin:6px auto 4px;}
.ringCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.statRow{display:flex;gap:10px;margin:16px 0 22px;}
.chip{flex:1;background:#fff;border:1.5px solid;border-radius:14px;padding:10px 4px;text-align:center;}
.chip .val{font-weight:800;font-size:18px;}
.chip .lbl{font-size:10.5px;color:var(--sub);font-weight:700;margin-top:1px;}
.catRow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;}
.catIcon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.catTop{display:flex;justify-content:space-between;margin-bottom:5px;}
.ctaRow{display:flex;gap:10px;margin-top:20px;margin-bottom:20px;}
.cta{flex:1;border:none;color:#fff;font-weight:800;font-size:14px;padding:13px 0;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.12);}
/* browse */
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);font-size:14px;outline:none;margin-bottom:12px;}
.chipRow{display:flex;flex-wrap:wrap;}
.catChip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:#5B6779;font-weight:800;font-size:12.5px;margin-right:7px;margin-bottom:7px;white-space:nowrap;}
.catChip.active{}
.rowCard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:8px;}
.rowHead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;}
.rowDot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rowBody{padding:0 12px 12px;}
.levelBtnRow{display:flex;gap:6px;}
.levelBtn{flex:1;border:none;border-radius:10px;padding:8px 2px;font-size:11px;font-weight:800;}
/* study */
.cardWrap{perspective:1200px;margin-top:8px;position:relative;}
.flashcard{position:relative;height:230px;border-radius:22px;box-shadow:0 14px 30px rgba(35,48,71,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;color:#fff;text-align:center;cursor:pointer;}
.flashcard.back{background:#fff;border:1.5px solid #EEF1F7;color:var(--ink);}
.fcTab{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;}
.fcTab.backTab{background:var(--tabbg,#EEE);}
.fcPos{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;opacity:.85;}
.fcEn{font-weight:800;font-size:30px;margin-top:6px;word-break:break-word;}
.fcZh{font-size:20px;font-weight:800;color:var(--ink);margin-top:10px;}
.fcHint{position:absolute;bottom:16px;font-size:11px;opacity:.85;font-weight:700;}
.rateRow{display:flex;gap:8px;margin-top:18px;}
.rateBtn{flex:1;border:none;border-radius:14px;padding:10px 2px;color:#fff;}
.emptyWrap{text-align:center;padding:50px 10px;}
/* quiz */
.introCard{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;}
.qzTopRow{display:flex;gap:8px;margin-bottom:14px;}
.qzPill{flex:1;text-align:center;background:#EEF1FB;color:var(--blue);font-weight:800;font-size:11.5px;padding:7px 4px;border-radius:999px;}
.qCard{border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 10px 24px rgba(35,48,71,.15);color:#fff;}
.qOption{text-align:left;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;font-weight:700;background:#fff;width:100%;color:var(--ink);}
.qOption.correct{background:#E9F7EF;border-color:var(--green);color:#177350;}
.qOption.wrong{background:#FDECEE;border-color:var(--red);color:#B3223F;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d7dce3;border-radius:4px;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ============================================================
   劍橋 Movers 單字資料（同前一版本，來源：Cambridge English
   Pre A1 Starters / A1 Movers / A2 Flyers Wordlist，僅收錄
   Movers 等級新增詞彙，依主題分類）
   ============================================================ */
const PHONICS_GROUPS = [
  { group: 1, sounds: [
    { grapheme: "s", words: ["sun", "sit", "six"] },
    { grapheme: "a", words: ["ant", "apple", "cat"] },
    { grapheme: "t", words: ["tap", "ten", "top"] },
    { grapheme: "i", words: ["ink", "pig", "six"] },
    { grapheme: "p", words: ["pen", "pig", "cup"] },
    { grapheme: "n", words: ["net", "sun", "pin"] },
  ]},
  { group: 2, sounds: [
    { grapheme: "c k", words: ["cat", "kite", "duck"] },
    { grapheme: "e", words: ["egg", "pen", "ten"] },
    { grapheme: "h", words: ["hat", "hen", "hot"] },
    { grapheme: "r", words: ["run", "red", "rat"] },
    { grapheme: "m", words: ["map", "mum", "man"] },
    { grapheme: "d", words: ["dog", "dad", "doll"] },
  ]},
  { group: 3, sounds: [
    { grapheme: "g", words: ["go", "get", "dog"] },
    { grapheme: "o", words: ["dog", "hot", "box"] },
    { grapheme: "u", words: ["up", "sun", "cup"] },
    { grapheme: "l", words: ["leg", "log", "lip"] },
    { grapheme: "f", words: ["fan", "fish", "fox"] },
    { grapheme: "b", words: ["bat", "big", "bus"] },
  ]},
  { group: 4, sounds: [
    { grapheme: "ai", words: ["rain", "tail", "snail"] },
    { grapheme: "j", words: ["jam", "jug", "jump"] },
    { grapheme: "oa", words: ["boat", "coat", "goat"] },
    { grapheme: "ie", words: ["pie", "tie", "cried"] },
    { grapheme: "ee", words: ["bee", "tree", "feet"] },
    { grapheme: "or", words: ["fork", "corn", "horn"] },
  ]},
  { group: 5, sounds: [
    { grapheme: "z", words: ["zip", "zebra", "zoo"] },
    { grapheme: "w", words: ["web", "wet", "win"] },
    { grapheme: "ng", words: ["king", "ring", "song"] },
    { grapheme: "v", words: ["van", "vet", "violin"] },
    { grapheme: "oo (short)", words: ["book", "look", "foot"] },
    { grapheme: "oo (long)", words: ["moon", "spoon", "food"] },
  ]},
  { group: 6, sounds: [
    { grapheme: "y", words: ["yes", "yellow", "yo-yo"] },
    { grapheme: "x", words: ["box", "fox", "six"] },
    { grapheme: "ch", words: ["chip", "chin", "cheese"] },
    { grapheme: "sh", words: ["ship", "shop", "fish"] },
    { grapheme: "th (voiced)", words: ["this", "that", "mother"] },
    { grapheme: "th (unvoiced)", words: ["thumb", "three", "bath"] },
  ]},
  { group: 7, sounds: [
    { grapheme: "qu", words: ["queen", "quiz", "quick"] },
    { grapheme: "ou", words: ["out", "cloud", "mouth"] },
    { grapheme: "oi", words: ["coin", "boil", "oil"] },
    { grapheme: "ue", words: ["blue", "glue", "true"] },
    { grapheme: "er", words: ["her", "fern", "sister"] },
    { grapheme: "ar", words: ["car", "star", "arm"] },
  ]},
];
const PHONICS = PHONICS_GROUPS.flatMap((g) =>
  g.sounds.map((s, i) => ({
    id: `p${g.group}_${i}`,
    group: g.group,
    grapheme: s.grapheme,
    words: s.words,
  }))
);

const GROUP_COLORS = { 1:"#06D6A0", 2:"#FF6FB5", 3:"#7B61FF", 4:"#F78C6B", 5:"#FFB703", 6:"#118AB2", 7:"#E63946" };

const LEVELS = [
  { level: 0, label: "尚未學習", emoji: "⚪", color: "#CBD5E1" },
  { level: 1, label: "不熟悉", emoji: "😵", color: "#EF476F" },
  { level: 2, label: "普通", emoji: "😐", color: "#FFB703" },
  { level: 3, label: "熟悉", emoji: "🙂", color: "#06D6A0" },
  { level: 4, label: "精通", emoji: "🌟", color: "#118AB2" },
];
const levelInfo = (lv) => LEVELS[Math.max(0, Math.min(4, lv || 0))];

/* ---------- group filtering (7 phonics groups, simpler than the word-app's category+letter system) ---------- */
function poolForGroup(g) {
  return g === "all" ? PHONICS : PHONICS.filter((p) => String(p.group) === String(g));
}
function groupChipHtml(active, group, onclick) {
  const label = group === "all" ? "全部" : `第 ${group} 組`;
  const color = group === "all" ? "#233047" : GROUP_COLORS[group];
  return `<button class="catChip" style="border-color:${active ? color : "#E4E8F0"};background:${active ? color + "1A" : "#fff"};color:${active ? color : "#5B6779"};" onclick="${onclick}">${label}</button>`;
}

const BADGES = [
  { id: "first5", label: "初次見面", emoji: "🌱", desc: "學習 5 個發音", test: (s) => s.studiedCount >= 5 },
  { id: "halfway", label: "過半達成", emoji: "🐣", desc: "學習 21 個發音（過半）", test: (s) => s.studiedCount >= 21 },
  { id: "allLearned", label: "42 音全通", emoji: "🦉", desc: "學習全部 42 個發音", test: (s) => s.studiedCount >= 42 },
  { id: "master10", label: "精通新星", emoji: "⭐", desc: "精通 10 個發音", test: (s) => s.masteredCount >= 10 },
  { id: "masterAll", label: "自然發音大師", emoji: "👑", desc: "精通全部 42 個發音", test: (s) => s.masteredCount >= 42 },
  { id: "streak3", label: "連續三天", emoji: "🔥", desc: "連續打卡 3 天", test: (s, d) => (d.streak || 0) >= 3 },
  { id: "streak7", label: "一週不間斷", emoji: "🏅", desc: "連續打卡 7 天", test: (s, d) => (d.streak || 0) >= 7 },
  { id: "streak30", label: "月度冠軍", emoji: "🏆", desc: "連續打卡 30 天", test: (s, d) => (d.streak || 0) >= 30 },
];

const DAILY_GOAL = 15;
const QUIZ_LEN = 10;

/* ---------- storage (plain localStorage — fully offline, no login needed) ---------- */
const PKEY = "phonics-progress-v1";
const HKEY = "phonics-hiscore-v1";
const DKEY = "phonics-daily-v1";
function lget(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    return fallback;
  }
}
function lset(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {
    console.error("save failed", e);
  }
}

/* ---------- date / streak helpers ---------- */
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}
function rollDaily(d) {
  const today = todayStr();
  if (d.date === today) return d;
  const gap = daysBetween(d.date, today);
  const keepStreak = gap === 1 && d.countedToday;
  return { ...d, date: today, todayCount: 0, countedToday: false, streak: keepStreak ? d.streak : 0 };
}
function getSoundOfDay() {
  const key = todayStr();
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return PHONICS[hash % PHONICS.length];
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// Safely embeds `text` as a single-quoted JS string literal inside an
// onclick="..." (double-quoted) HTML attribute. Order matters: JS-escape
// first (backslash, then quote), THEN HTML-escape only the characters that
// would break the attribute itself (& and "). Escaping HTML first (as an
// earlier version of this file did) turns ' into the entity &#39; before
// the JS-escape step ever runs, so the JS-escape regex finds nothing to
// escape — the browser then HTML-decodes &#39; back into a raw, unescaped
// ' when parsing the attribute, which terminates the JS string early and
// throws a syntax error. That silently broke every word containing an
// apostrophe (o'clock, let's, ...): tapping did nothing at all, not even
// falling back to the device voice, because pronounce() was never called.
function jsAttrString(text) {
  const jsEscaped = String(text).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  return jsEscaped.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- pronunciation (built into iOS/Safari, no internet needed) ---------- */
const PREFERRED_VOICE_NAMES = [
  "Samantha", "Ava", "Allison", "Susan", "Nicky", "Zoe", "Evan",
  "Karen", "Moira", "Tessa", "Daniel", "Serena", "Kate", "Stephanie", "Aaron",
];
// Apple's "novelty" voices (Albert, Bad News, Zarvox, etc.) register under
// en-US/en-GB too but are joke sound-effect voices, not useful for a
// vocabulary app — filtered out everywhere voices are listed or picked.
const NOVELTY_VOICE_NAMES = [
  "albert", "bad news", "bahh", "bells", "boing", "bubbles", "cellos",
  "good news", "jester", "organ", "pipe organ", "superstar", "trinoids",
  "whisper", "wobble", "zarvox", "deranged", "hysterical", "junior",
  "ralph", "princess", "kathy", "fred", "bruce", "rocko", "sandy", "shelley",
];
function isNoveltyVoice(v) {
  const n = v.name.toLowerCase();
  return NOVELTY_VOICE_NAMES.some((bad) => n.includes(bad));
}
function usableEnglishVoices() {
  const all = ("speechSynthesis" in window) ? window.speechSynthesis.getVoices() : [];
  return all.filter((v) => (v.lang === "en-US" || v.lang === "en-GB") && !isNoveltyVoice(v));
}
let cachedVoice = null;
function pickBestVoice() {
  const en = usableEnglishVoices();
  if (!en.length) return null;
  // 1) explicit high-quality hints exposed by some platforms
  let v = en.find((v) => /premium|enhanced|neural/i.test(v.name) || /premium|enhanced|neural/i.test(v.voiceURI));
  if (v) return v;
  // 2) known natural-sounding default voices (macOS/iOS), en-US preferred
  for (const name of PREFERRED_VOICE_NAMES) {
    v = en.find((vv) => vv.name === name && vv.lang === "en-US");
    if (v) return v;
  }
  for (const name of PREFERRED_VOICE_NAMES) {
    v = en.find((vv) => vv.name.includes(name));
    if (v) return v;
  }
  // 3) fall back to any en-US voice, then en-GB
  return en.find((v) => v.lang === "en-US") || en[0];
}
const VKEY = "phonics-voice-v1";
function getSelectedVoice() {
  // a manually-picked voice (see the voice picker on Home) always wins —
  // this is what makes downloading an Enhanced/Premium system voice
  // actually take effect, since the auto heuristic below might otherwise
  // settle on a different voice than the one that was upgraded
  const pref = STATE.voicePref && STATE.voicePref.voiceURI;
  if (pref && "speechSynthesis" in window) {
    const v = window.speechSynthesis.getVoices().find((vv) => vv.voiceURI === pref);
    if (v) return v;
  }
  if (!cachedVoice) cachedVoice = pickBestVoice();
  return cachedVoice;
}
function canonicalWord(raw) {
  // strip parenthetical content with proper depth-tracking so nested
  // parens (e.g. "candy (sweet(s))") are fully removed, not just to the
  // first closing paren — a naive regex here breaks spelling checks
  let out = "", depth = 0;
  for (const ch of raw) {
    if (ch === "(") { depth++; continue; }
    if (ch === ")") { if (depth > 0) depth--; continue; }
    if (depth === 0) out += ch;
  }
  return out.replace(/\/.*/g, "").trim();
}
// manual respelling overrides for words a device's TTS voice mispronounces —
// add more here (lowercase key) if other words still sound wrong after testing
const PRONOUNCE_OVERRIDES = {
  cook: "kuk",
};
function speakTextFor(rawText) {
  const base = canonicalWord(rawText);
  const override = PRONOUNCE_OVERRIDES[base.toLowerCase()];

  let streak = STATE.daily.streak, countedToday = STATE.daily.countedToday, hit = false;

  if (hit) showToast(`🎉 完成今日目標！連續 ${streak} 天`);

function checkBadges() {
  const stats = computeStats();
  const earned = BADGES.filter((b) => !STATE.daily.badges.includes(b.id) && b.test(stats, STATE.daily));
  if (earned.length) {
    STATE.daily = { ...STATE.daily, badges: [...STATE.daily.badges, ...earned.map((b) => b.id)] };
    saveDaily();
    showToast(`${earned[0].emoji} 獲得新貼紙：${earned[0].label}！`);
  }
}

function computeStats() {
  const byGroup = {};
  for (let g = 1; g <= 7; g++) byGroup[g] = { total: 0, mastered: 0, weighted: 0, studied: 0 };
  let masteredCount = 0, studiedCount = 0, weightedSum = 0;
  PHONICS.forEach((p) => {
    const lv = (STATE.progress[p.id] || {}).level || 0;
    byGroup[p.group].total++;
    byGroup[p.group].weighted += lv;
    if (lv >= 4) { masteredCount++; byGroup[p.group].mastered++; }
    if (lv > 0) { studiedCount++; byGroup[p.group].studied++; }
    weightedSum += lv;
  });
  return {
    total: PHONICS.length, masteredCount, masteredPct: PHONICS.length ? masteredCount / PHONICS.length : 0,
    studiedCount, avgLevel: PHONICS.length ? weightedSum / PHONICS.length : 0, byGroup,
  };
}

/* ---------- shared: build a session queue that mixes unseen + weak + strong
   words, so a session never ends up only cycling "not familiar" repeats ---------- */
function buildWeightedQueue(pool, target) {
  target = Math.min(target, pool.length);
  const withLevel = pool.map((w) => ({ w, lv: (STATE.progress[w.id] || {}).level || 0 }));
  const unseen = shuffle(withLevel.filter((x) => x.lv === 0).map((x) => x.w));
  const weak = shuffle(withLevel.filter((x) => x.lv === 1 || x.lv === 2).map((x) => x.w));
  const strong = shuffle(withLevel.filter((x) => x.lv >= 3).map((x) => x.w));
  let queue = [];
  const take = (arr, n) => { const t = arr.splice(0, n); queue = queue.concat(t); };
  // roughly 60% of the session introduces new/unseen words, the rest reinforces weak ones
  take(unseen, Math.ceil(target * 0.6));
  take(weak, target - queue.length);
  take(unseen, target - queue.length);
  take(strong, target - queue.length);
  if (queue.length < target) {
    const used = new Set(queue.map((w) => w.id));
    const rest = shuffle(pool.filter((w) => !used.has(w.id)));
    queue = queue.concat(rest.slice(0, target - queue.length));
  }
  return shuffle(queue);
}

// Reduces "c k" / "th (voiced)" / "oo (short)" etc. down to just the letters
// to search for (so "c k" checks for either c or k, "th (voiced)" checks for "th").
function graphemeLetters(g) {
  return g.replace(/\s*\([^)]*\)/g, "").trim().split(/\s+/).filter(Boolean);
}
function soundAppearsInWord(sound, word) {
  const w = word.toLowerCase();
  return graphemeLetters(sound.grapheme).some((g) => w.includes(g.toLowerCase()));
}
function buildQuizQuestions(group) {
  let pool = poolForGroup(group);
  if (pool.length < 4) pool = PHONICS;
  const chosen = buildWeightedQueue(pool, QUIZ_LEN);
  return chosen.map((p) => {
    const promptWord = p.words[Math.floor(Math.random() * p.words.length)];
    // A prompt word often legitimately contains other taught sounds too
    // (e.g. "sun" contains s, u, AND n) — offering one of those as a wrong
    // option would make the question ambiguous, since it'd also technically
    // be "in" the word. Exclude any distractor whose grapheme is spelled
    // inside the prompt word at all.
    const safePool = shuffle(pool.filter((x) => x.id !== p.id && !soundAppearsInWord(x, promptWord)));
    let distractors = safePool.slice(0, 3);
    if (distractors.length < 3) {
      // this group's pool didn't have enough non-overlapping options —
      // widen the search to the full 42-sound set, same rule applied
      const used = new Set(distractors.map((d) => d.id));
      const extra = shuffle(PHONICS.filter((x) => x.id !== p.id && !used.has(x.id) && !soundAppearsInWord(x, promptWord)));
      distractors = distractors.concat(extra).slice(0, 3);
    }
    const options = shuffle([p, ...distractors]);
    return { sound: p, promptWord, options };
  });
}
function startQuiz(group) {
  STATE.quiz = { group, phase: "playing", questions: buildQuizQuestions(group), qi: 0, score: 0, streak: 0, picked: null, correctCount: 0 };
  render();
  const q = STATE.quiz.questions[0];
  if (q) setTimeout(() => pronounce(q.promptWord), 350);
}
function replayQuizWord() {
  const qz = STATE.quiz;
  const q = qz.questions[qz.qi];
  if (q) pronounce(q.promptWord);
}
function chooseQuizOption(optId) {
  const qz = STATE.quiz;
  if (qz.picked) return;
  const q = qz.questions[qz.qi];
  const isCorrect = optId === q.sound.id;
  qz.picked = optId;
  const curLv = (STATE.progress[q.sound.id] || {}).level || 0;
  if (isCorrect) {
    const bonus = Math.min(qz.streak * 2, 10);
    qz.score += 10 + bonus;
    qz.streak += 1;
    qz.correctCount += 1;
    updateSound(q.sound.id, { level: Math.min(4, curLv + 1), correct: ((STATE.progress[q.sound.id] || {}).correct || 0) + 1 });
  } else {
    qz.streak = 0;
    updateSound(q.sound.id, { level: Math.max(1, curLv - 1), wrong: ((STATE.progress[q.sound.id] || {}).wrong || 0) + 1 });
  }
  recordActivity(1);
  render();
  setTimeout(() => {
    if (qz.qi + 1 >= qz.questions.length) {
      qz.phase = "done";
      if (qz.score > (STATE.hiScore.best || 0)) { STATE.hiScore = { best: qz.score }; saveHiScore(); }
    } else {
      qz.qi += 1;
      qz.picked = null;
      const nextQ = qz.questions[qz.qi];
      if (nextQ) setTimeout(() => pronounce(nextQ.promptWord), 300);
    }
    render();
  }, 900);
}
function renderQuiz() {
  const qz = STATE.quiz;
  if (qz.phase === "setup") {
    return `<div class="pad">
      <div class="introCard">
        <div style="font-size:38px;">🎯</div>
        <div style="font-weight:800;font-size:18px;margin:8px 0 4px;">聽發音，選出正確的自然發音</div>
        <div style="font-size:13px;color:#8592A6;">會先唸出一個範例字，選出這個字裡包含的自然發音。每題答對 +10 分，連續答對有額外加分。</div>
        <div style="font-size:12px;color:#8592A6;margin-top:10px;font-weight:700;">歷史最高分：${STATE.hiScore.best || 0}</div>
      </div>
      <div class="sectionTitle">選擇範圍</div>
      <div class="chipRow">
        ${groupChipHtml(false, "all", `startQuiz('all')`)}
        ${[1,2,3,4,5,6,7].map((g) => groupChipHtml(false, g, `startQuiz(${g})`)).join("")}
      </div>
    </div>`;
  }
  if (qz.phase === "done") {
    const pct = Math.round((qz.correctCount / qz.questions.length) * 100);
    return `<div class="pad" style="text-align:center;">
      <div class="introCard">
        <div style="font-size:44px;">${pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "💪"}</div>
        <div style="font-weight:800;font-size:22px;margin:8px 0 4px;">得分 ${qz.score}</div>
        <div style="font-size:13px;color:#8592A6;">答對 ${qz.correctCount} / ${qz.questions.length}（${pct}%）</div>
        ${qz.score >= (STATE.hiScore.best || 0) && qz.score > 0 ? `<div style="margin-top:8px;color:#EF476F;font-weight:800;font-size:13px;">🎉 締造新紀錄！</div>` : ""}
      </div>
      <div class="ctaRow">
        <button class="cta" style="background:#4361EE;" onclick="startQuiz('${qz.group}')">🔁 再測一次</button>
        <button class="cta" style="background:#8592A6;" onclick="STATE.quiz.phase='setup';render();">選擇其他範圍</button>
      </div>
    </div>`;
  }
  const q = qz.questions[qz.qi];
  const color = GROUP_COLORS[q.sound.group];
  return `<div class="pad">
    <div class="qzTopRow">
      <div class="qzPill">題目 ${qz.qi+1}/${qz.questions.length}</div>
      <div class="qzPill" style="background:#FFF4DA;color:#B7791F;">🔥 連續 ${qz.streak}</div>
      <div class="qzPill" style="background:#E9F7EF;color:#2E7D4F;">⭐ ${qz.score} 分</div>
    </div>
    <div class="qCard" style="background:linear-gradient(150deg, ${color}, ${color}CC);">
      <div style="font-size:11px;font-weight:800;opacity:.85;">🔊 聽發音</div>
      <div style="margin-top:8px;">
        <button class="speakBtn" style="width:64px;height:64px;background:rgba(255,255,255,.25);color:#fff;font-size:30px;" onclick="replayQuizWord()" aria-label="重播發音">🔊</button>
      </div>
      <div style="font-size:12px;opacity:.85;margin-top:10px;">這個字裡包含哪一個自然發音？</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;">
      ${q.options.map((opt) => {
        let cls = "";
        if (qz.picked) {
          if (opt.id === q.sound.id) cls = "correct";
          else if (qz.picked === opt.id) cls = "wrong";
        }
        return `<button class="qOption ${cls}" style="flex:1;min-width:40%;text-align:center;font-size:22px;font-weight:800;" ${qz.picked ? "disabled" : ""} onclick="chooseQuizOption('${opt.id}')">${opt.grapheme}</button>`;
      }).join("")}
    </div>
  </div>`;
}


function bodyHtml() {
  if (STATE.tab === "home") return renderHome();
  if (STATE.tab === "browse") return renderBrowse();
  if (STATE.tab === "study") return renderStudy();
  if (STATE.tab === "quiz") return renderQuiz();
  return "";
}
function render() {
  const root = document.getElementById("app");
  root.innerHTML = `
    ${headerHtml()}
    <div class="body">${bodyHtml()}</div>
    ${tabBarHtml()}
    <div id="toastHost">${STATE.toast ? `<div class="toast">${escapeHtml(STATE.toast)}</div>` : ""}</div>
  `;
  if (STATE.tab === "browse") updateBrowseList();
}

// load voices ahead of time (some browsers populate this list async);
// clear the cached choice so pickBestVoice() re-evaluates once the full list is in
if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    cachedVoice = null;
    window.speechSynthesis.getVoices();
    if (STATE.tab === "home") render();
  };
}

render();
</script>
</body>
