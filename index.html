<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/app-icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#4361EE" />
<title>Movers 單字護照</title>
<style>
:root{
  --blue:#4361EE; --teal:#2EC4B6; --ink:#233047; --sub:#8592A6;
  --bg:#F6F8FC; --card:#ffffff; --border:#E4E8F0; --track:#EEF1F7;
  --green:#06D6A0; --amber:#FFB703; --red:#EF476F;
  --hdrA:#4361EE; --hdrB:#2EC4B6; --hdrShadow:rgba(67,97,238,.28); --accent:#4361EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.header{
  background:linear-gradient(135deg,#4361EE 0%,#2EC4B6 100%);
  color:#fff;padding:22px 20px 26px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;
  box-shadow:0 8px 24px rgba(67,97,238,.25);
  position:relative;
}
.appSwitchGroup{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.appSwitch{background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap;}
.htag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;margin-bottom:8px;}
.htitle{font-weight:800;font-size:24px;letter-spacing:.3px;}
.hsub{font-size:13px;opacity:.9;margin-top:3px;font-weight:600;}
.body{flex:1;overflow-y:auto;padding-bottom:84px;}
.pad{padding:16px 18px 6px;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(35,48,71,.06);z-index:40;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;position:relative;color:#8592A6;}
.tabbtn.active{color:var(--blue);}
.tabbtn .emo{font-size:20px;}
.tabbtn .lbl{font-size:11px;font-weight:800;margin-top:2px;}
.tabbtn .dot{position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:90%;text-align:center;}
.card{background:#fff;border-radius:16px;}
.sectionTitle{font-weight:800;font-size:15px;margin:16px 0 10px;}
.icoEmo{display:block;line-height:1;width:1em;height:1em;text-align:center;}
.speakBtn{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#EEF1FB;color:var(--blue);padding:0;line-height:1;text-align:center;-webkit-appearance:none;appearance:none;}
/* mascot */
.mascotWrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;}
.owl{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 6px 14px rgba(35,48,71,.1);}
.bubble{flex:1;background:#fff;border-radius:16px;padding:10px 14px;font-size:12.5px;font-weight:700;color:#4A5568;box-shadow:0 6px 14px rgba(35,48,71,.06);}
.streakBadge{position:absolute;top:-8px;right:-4px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;box-shadow:0 4px 10px rgba(255,183,3,.4);}
/* daily goal */
.dailyCard{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px;}
.dailyTop{display:flex;justify-content:space-between;margin-bottom:7px;}
.barTrack{height:7px;background:var(--track);border-radius:999px;overflow:hidden;}
.barFill{height:100%;border-radius:999px;transition:width .4s ease;}
.dailyStreakRow{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--sub);}
/* word of day */
.wodCard{border-radius:18px;padding:14px 16px;color:#fff;margin-bottom:18px;box-shadow:0 10px 22px rgba(35,48,71,.14);}
.wodLabel{font-size:11px;font-weight:800;opacity:.9;margin-bottom:6px;}
.wodRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.wodEn{font-weight:800;font-size:24px;word-break:break-word;}
.wodZh{font-size:12.5px;opacity:.92;margin-top:3px;font-weight:700;}
.wodFooter{font-size:11px;opacity:.85;margin-top:10px;font-weight:700;}
/* badges */
.badgeGrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.badge{width:78px;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 4px 10px rgba(35,48,71,.06);}
.badge.locked{opacity:.5;}
.badge .emo{font-size:22px;margin-bottom:3px;}
.badge .lbl{font-size:9.5px;font-weight:800;color:#5B6779;line-height:1.2;}
/* ring */
.ring{position:relative;width:132px;height:132px;margin:6px auto 4px;}
.ringCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.statRow{display:flex;gap:10px;margin:16px 0 22px;}
.chip{flex:1;background:#fff;border:1.5px solid;border-radius:14px;padding:10px 4px;text-align:center;}
.chip .val{font-weight:800;font-size:18px;}
.chip .lbl{font-size:10.5px;color:var(--sub);font-weight:700;margin-top:1px;}
.catRow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;}
.catIcon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.catTop{display:flex;justify-content:space-between;margin-bottom:5px;}
.ctaRow{display:flex;gap:10px;margin-top:20px;margin-bottom:20px;}
.cta{flex:1;border:none;color:#fff;font-weight:800;font-size:14px;padding:13px 0;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.12);}
/* browse */
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);font-size:14px;outline:none;margin-bottom:12px;}
.chipRow{display:flex;flex-wrap:wrap;}
.catChip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:#5B6779;font-weight:800;font-size:12.5px;margin-right:7px;margin-bottom:7px;white-space:nowrap;}
.catChip.active{}
.rowCard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:8px;}
.rowHead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;}
.rowDot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rowBody{padding:0 12px 12px;}
.levelBtnRow{display:flex;gap:6px;}
.levelBtn{flex:1;border:none;border-radius:10px;padding:8px 2px;font-size:11px;font-weight:800;}
/* study */
.cardWrap{perspective:1200px;margin-top:8px;position:relative;}
.flashcard{position:relative;height:230px;border-radius:22px;box-shadow:0 14px 30px rgba(35,48,71,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;color:#fff;text-align:center;cursor:pointer;}
.flashcard.back{background:#fff;border:1.5px solid #EEF1F7;color:var(--ink);}
.fcTab{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;}
.fcTab.backTab{background:var(--tabbg,#EEE);}
.fcPos{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;opacity:.85;}
.fcEn{font-weight:800;font-size:30px;margin-top:6px;word-break:break-word;}
.fcZh{font-size:20px;font-weight:800;color:var(--ink);margin-top:10px;}
.fcHint{position:absolute;bottom:18px;left:18px;font-size:11px;opacity:.85;font-weight:700;text-align:left;}
.rateRow{display:flex;gap:8px;margin-top:18px;}
.rateBtn{flex:1;border:none;border-radius:14px;padding:10px 2px;color:#fff;}
.emptyWrap{text-align:center;padding:50px 10px;}
/* quiz */
.introCard{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;}
.qzTopRow{display:flex;gap:8px;margin-bottom:14px;}
.qzPill{flex:1;text-align:center;background:#EEF1FB;color:var(--blue);font-weight:800;font-size:11.5px;padding:7px 4px;border-radius:999px;}
.qCard{border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 10px 24px rgba(35,48,71,.15);color:#fff;}
.qOption{text-align:left;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;font-weight:700;background:#fff;width:100%;color:var(--ink);}
.qOption.correct{background:#E9F7EF;border-color:var(--green);color:#177350;}
.qOption.wrong{background:#FDECEE;border-color:var(--red);color:#B3223F;}
.qPicGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.qOption.pic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:118px;padding:12px 8px;}
.qOption.pic .picLbl{font-size:13px;font-weight:800;min-height:18px;}
/* daily missions + treasure chest */
.missionCard{background:#fff;border-radius:20px;padding:14px 14px 12px;box-shadow:0 6px 18px rgba(35,48,71,.06);margin-bottom:18px;}
.mHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin:0 2px 8px;}
.mHead span:last-child{font-size:12.5px;color:var(--sub);}
.mRow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 10px;border-radius:14px;background:#F6F8FC;margin-bottom:8px;text-align:left;color:var(--ink);}
.mRow.done{background:#E9F7EF;}
.mRow .mEmo{font-size:24px;width:30px;text-align:center;}
.mRow .mMid{flex:1;min-width:0;}
.mRow .mLbl{font-weight:800;font-size:14.5px;margin-bottom:5px;}
.mRow .mCnt{font-weight:800;font-size:13px;color:var(--sub);min-width:44px;text-align:right;}
.mRow.done .mCnt{color:#177350;}
.chestBtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;font-weight:800;font-size:15.5px;margin-top:2px;}
.chestBtn.locked{background:#F1F3F8;color:#8592A6;}
.chestBtn.ready{background:linear-gradient(135deg,#FFB703,#FB8500);color:#fff;box-shadow:0 8px 18px rgba(251,133,0,.35);animation:chestWiggle 1.6s ease-in-out infinite;}
.chestBtn.opened{background:#FFF4DA;color:#B7791F;}
.chestBtn .cEmo{font-size:28px;}
.seriesWrap{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.seriesRow{background:#fff;border-radius:14px;padding:10px 10px 8px;border:1.5px solid transparent;}
.seriesRow.active{border-color:#FFB703;}
.seriesHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;margin-bottom:6px;}
.seriesHead span:last-child{color:var(--sub);font-size:12.5px;}
.nowTag{margin-left:6px;font-size:11px;background:#FFF4DA;color:#B7791F;padding:2px 7px;border-radius:999px;}
.medal{margin-right:6px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#E9F7EF;font-size:13px;}
.medal.gold{background:linear-gradient(135deg,#FFE27A,#F4B400);box-shadow:0 0 0 1.5px #E0A100;}
.stkGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.stkCell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#F6F8FC;}
.stkCell.empty .stk{filter:grayscale(1);opacity:.22;}
.stkCell.shinyCell{background:linear-gradient(135deg,#FFF6CC,#FFE08A);box-shadow:inset 0 0 0 1.5px #F4B400;}
.stk{display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.stkCell .stk{width:100%;height:100%;}
button.stkCell{padding:3px;}
.stkCell{padding:3px;}
.medal .stk{width:16px;height:16px;margin:3px;}
.chestBtn .stk{flex-shrink:0;}
.stkView{position:fixed;inset:0;background:rgba(20,28,45,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease;}
.stkCard{position:relative;background:#fff;border-radius:28px;width:100%;max-width:340px;padding:26px 18px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:stkPop .42s cubic-bezier(.2,1.4,.4,1);}
.stkCard.gold{background:linear-gradient(160deg,#FFFBEA,#FFE9A8);box-shadow:0 0 0 3px #F4B400,0 20px 50px rgba(0,0,0,.25);}
.stkBig{display:flex;justify-content:center;}
.stkBig .stk{width:220px;height:220px;max-width:70vw;max-height:70vw;animation:stkFloat 2.6s ease-in-out infinite;}
.stkEn{font-weight:800;font-size:32px;margin-top:6px;}
.stkZh{font-size:17px;color:var(--sub);font-weight:700;margin-top:2px;}
.stkBtns{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:12px;}
.stkMsg{margin-top:12px;font-size:13.5px;font-weight:700;color:#B7791F;}
.stkNew{position:absolute;top:14px;left:16px;background:#EF476F;color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;}
.stkCard.gold .stkNew{background:#E0A100;}
.stkClose{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;font-size:18px;color:#8592A6;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stkPop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes stkFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.stk.shiny{filter:drop-shadow(0 0 3px rgba(244,180,0,.9)) saturate(1.3);animation:shine 2.4s ease-in-out infinite;}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 2px rgba(244,180,0,.7)) saturate(1.2)}50%{filter:drop-shadow(0 0 6px rgba(255,214,10,1)) saturate(1.5) brightness(1.08)}}
@keyframes chestWiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
/* ---------- theme + lively motion ---------- */
.header{background:linear-gradient(135deg,var(--hdrA) 0%,var(--hdrB) 100%);box-shadow:0 8px 24px var(--hdrShadow);overflow:hidden;}
.header::before,.header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none;z-index:0;}
.header::before{width:150px;height:150px;right:-46px;bottom:-70px;animation:floaty 6s ease-in-out infinite;}
.header::after{width:72px;height:72px;left:44%;top:-34px;animation:floaty 7.5s ease-in-out infinite reverse;}
.htagRow,.htitle,.hsub{position:relative;z-index:1;}
.appSwitchGroup{z-index:2;}
.htagRow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;max-width:calc(100% - 112px);}
.htagRow .htag{margin-bottom:0;}
.accentBtn{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:#fff;background:rgba(255,255,255,.28);padding:4px 10px;border-radius:999px;white-space:nowrap;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tabbtn.active{color:var(--accent);}
.tabbtn .dot{background:var(--accent);}
.tabbtn.active .emo{animation:tabPop .35s ease;}
@keyframes tabPop{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.owl{animation:owlBob 3.2s ease-in-out infinite;}
@keyframes owlBob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-6deg)}75%{transform:translateY(-3px) rotate(6deg)}}
.cta,.rateBtn,.qOption,.speakBtn,.levelBtn,.catChip,.accentBtn{transition:transform .12s ease;}
.cta:active,.rateBtn:active,.qOption:active,.speakBtn:active,.levelBtn:active,.catChip:active,.accentBtn:active{transform:scale(.93);}
/* 3D flip card */
.flipInner{position:relative;height:230px;cursor:pointer;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;}
.flipInner.flipped{transform:rotateY(180deg);}
.flipInner .flashcard{position:absolute;top:0;left:0;right:0;bottom:0;height:auto;padding-bottom:64px;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.flipInner .flashcard.back{transform:rotateY(180deg);}
.flipInner:not(.flipped) .flashcard.back,.flipInner.flipped .flashcard.front{pointer-events:none;}
.cardCtrls{position:absolute;bottom:14px;right:14px;z-index:5;display:flex;gap:20px;align-items:center;}
.cardCtrls .speakBtn{box-shadow:0 4px 12px rgba(35,48,71,.18);}
.cardEnter{animation:cardIn .35s ease-out;}
@keyframes cardIn{from{opacity:0;transform:translateX(36px) rotate(2deg)}to{opacity:1;transform:none}}
/* right / wrong feedback */
.qOption.correct,.pop{animation:pop .45s ease;}
.qOption.wrong,.shake{animation:shake .45s ease;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fxLayer{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:90;overflow:hidden;}
.fxBit{position:absolute;font-size:22px;left:50%;top:42%;opacity:0;animation:burst .9s ease-out forwards;}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot));opacity:0}}
.fxText{position:absolute;left:50%;top:36%;font-size:28px;font-weight:900;color:var(--accent);text-shadow:0 2px 0 #fff,0 4px 14px rgba(0,0,0,.18);white-space:nowrap;animation:floatUp 1.1s ease-out forwards;}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
/* ---------- practice-first layout ---------- */
:root{--sub:#66748A;}
.header::before,.header::after{display:none;}
.owl{animation:none;}
.header{padding:18px 20px 20px;}
.hsub{font-size:13.5px;}
.gearBtn{position:absolute;top:16px;right:16px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;}
.htagRow{max-width:calc(100% - 52px);}
.heroCard{background:#fff;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(35,48,71,.06);margin-bottom:14px;}
.miniRing{position:relative;width:78px;height:78px;flex-shrink:0;}
.miniRing .c{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.bigCta{display:block;width:100%;background:var(--accent);color:#fff;font-weight:800;font-size:18px;padding:18px 0;border-radius:18px;box-shadow:0 10px 22px var(--hdrShadow);margin-bottom:10px;transition:transform .12s ease;}
.bigCta:active{transform:scale(.96);}
.subCtaRow{display:flex;gap:10px;margin-bottom:18px;}
.subCta{flex:1;background:#fff;color:var(--ink);font-weight:800;font-size:15px;padding:14px 0;border-radius:14px;border:1.5px solid var(--border);}
.foldHead{display:flex;width:100%;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:15px 16px;font-weight:800;font-size:15px;color:var(--ink);margin:4px 0 10px;}
.foldHead span{color:var(--sub);font-size:13px;}
.scopeBar{display:flex;width:100%;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.scopeBar .chg{color:var(--accent);font-size:13px;}
.sheetBg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,28,45,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));}
.seg{display:flex;background:#E8ECF3;border-radius:12px;padding:4px;gap:4px;}
.seg button{flex:1;padding:11px 0;border-radius:9px;font-weight:800;font-size:14.5px;color:#5B6779;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(35,48,71,.12);}
.segNote{font-size:12px;color:var(--sub);margin:7px 2px 0;line-height:1.5;}
.offBtn{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;}
.offBtn.ghost{background:#EEF1F7;color:var(--ink);}
.offLink{display:block;margin:8px 2px 0;font-size:12.5px;font-weight:700;color:#B3223F;min-height:32px;}
.appLink{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;margin-bottom:8px;}
.appLink span{color:var(--sub);}
.sheetLabel{font-size:13px;font-weight:800;color:var(--sub);margin:18px 2px 8px;}
/* ---------- flashcards: pictures, swipe, session progress ---------- */
.flipInner{height:304px;touch-action:pan-y;-webkit-user-select:none;user-select:none;}
.fcPic{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.12);margin-top:6px;}
.fcPic img{width:70px;height:70px;pointer-events:none;}
.fcPicSm{width:58px;height:58px;margin-bottom:2px;}
.fcPicSm img{width:58px;height:58px;pointer-events:none;}
.swipeTag{position:absolute;top:20px;z-index:6;padding:5px 12px;border-radius:12px;font-weight:900;font-size:17px;border:3px solid;background:#fff;opacity:0;pointer-events:none;}
.swipeTag.yes{left:20px;color:#06A77D;border-color:#06D6A0;transform:rotate(-12deg);}
.swipeTag.no{right:20px;color:#D63B5F;border-color:#EF476F;transform:rotate(12deg);}
.sessBar{display:flex;align-items:center;gap:10px;margin:12px 2px 10px;}
.sessTrack{flex:1;height:8px;background:var(--track);border-radius:999px;overflow:hidden;}
.sessFill{height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease;}
.sessTxt{font-size:12.5px;font-weight:800;color:var(--sub);white-space:nowrap;}
.swipeHint{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:800;margin:10px 6px 0;}
.sumCard{background:#fff;border-radius:20px;padding:20px 18px;text-align:center;box-shadow:0 6px 18px rgba(35,48,71,.06);margin-top:12px;}
.sumStars{font-size:34px;letter-spacing:4px;margin:4px 0 6px;}
.sumStats{display:flex;gap:10px;margin:14px 0 4px;}
.sumStat{flex:1;border-radius:14px;padding:10px 4px;}
.sumStat .v{font-weight:900;font-size:22px;}
.sumStat .l{font-size:12px;font-weight:800;margin-top:2px;}
.weakList{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left;}
.weakItem{display:flex;align-items:center;gap:10px;background:#F6F8FC;border-radius:12px;padding:8px 10px;}
.weakItem img{width:30px;height:30px;flex-shrink:0;}
.hl{color:var(--accent);font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;}
.rowPic{width:30px;height:30px;flex-shrink:0;}
/* ---------- example sentences ---------- */
.flipInner.hasSent{height:344px;}
.sentBox{display:flex;align-items:center;gap:10px;background:#F6F8FC;border-radius:14px;padding:10px 10px 10px 12px;text-align:left;width:100%;margin-top:10px;cursor:default;}
.sentBox.inRow{margin:0 0 12px;background:#fff;border:1.5px solid var(--border);}
.sentText{flex:1;min-width:0;}
.sentEn{font-size:16px;font-weight:700;line-height:1.4;color:var(--ink);}
.sentZh{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.4;}
.sentBtns{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;}
.flashcard.back.withSent{justify-content:flex-start;padding-top:44px;}
.flashcard.back.withSent .fcPicSm,.flashcard.back.withSent .fcPicSm img{width:46px;height:46px;}
.flashcard.back.withSent .fcEn{font-size:24px;margin-top:2px;}
.flashcard.back.withSent .fcZh{font-size:17px;margin-top:4px;}
/* ---------- 對或錯 game ---------- */
.tfCard{background:#fff;border-radius:22px;padding:18px 16px 16px;text-align:center;box-shadow:0 10px 24px rgba(35,48,71,.10);}
.tfPic{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;background:#F6F8FC;display:flex;align-items:center;justify-content:center;}
.tfPic img{width:120px;height:120px;pointer-events:none;}
.tfStamp{position:absolute;right:-6px;top:-6px;width:46px;height:46px;border-radius:50%;color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.18);}
.tfStamp.yes{background:#06D6A0;}
.tfStamp.no{background:#EF476F;}
.tfCard.done{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;}
.tfCard.done .tfPic{width:84px;height:84px;flex-shrink:0;margin:0;}
.tfCard.done .tfPic img{width:66px;height:66px;}
.tfCard.done .tfStamp{width:32px;height:32px;font-size:18px;right:-8px;top:-8px;}
.tfCard.done .tfSent{font-size:17px;margin-top:0;flex:1;}
.tfCard.done .tfListen{margin-top:0;}
.tfCard.done .tfListen .sentBtns{flex-direction:column;gap:6px;}
.tfSent{font-size:21px;font-weight:800;line-height:1.45;color:var(--ink);margin-top:14px;}
.tfListen{margin-top:12px;display:flex;justify-content:center;}
.tfBtns{display:flex;gap:12px;margin-top:16px;}
.tfBtn{flex:1;min-height:64px;border-radius:18px;font-size:22px;font-weight:900;color:#fff;border:none;box-shadow:0 6px 14px rgba(35,48,71,.14);}
.tfBtn.yes{background:#06D6A0;}
.tfBtn.no{background:#EF476F;}
.tfBtn:active{transform:scale(.95);}
.tfFeedback{margin-top:12px;border-radius:16px;padding:12px 14px;text-align:left;}
.tfFeedback.right{background:#E9F7EF;}
.tfFeedback.wrong{background:#FFF4DA;}
.tfFbTitle{font-weight:900;font-size:18px;}
.tfFbBody{font-size:14.5px;margin-top:6px;line-height:1.5;}
.tfFbWord{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:16px;}
.tfFbWord img{width:36px;height:36px;}
.tfFbZh{font-size:13px;color:var(--sub);margin-top:8px;}
.tfMore{margin-top:16px;}
.tfModes{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.tfMode{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--border);border-radius:18px;padding:14px 16px;min-height:64px;color:var(--ink);}
.tfMode.on{border-color:var(--accent);}
.tfMode b{display:block;font-size:17px;}
.tfMode small{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;}
.tfModeIco{font-size:30px;}
.tfCount{display:flex;flex-direction:column;align-items:center;margin-top:10px;}
.tfCount span{font-family:inherit;font-size:64px;font-weight:900;line-height:1;color:var(--accent);animation:pop .45s ease;}
.tfCount small{font-size:14px;font-weight:800;color:var(--sub);margin-top:6px;}
.tfBtn:disabled{opacity:.45;}
.tfHidden{font-size:17px;font-weight:800;color:var(--sub);margin-top:16px;}
.tfFbFix{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:16px;font-weight:700;}
.tfFbFix>span:first-child{flex:1;min-width:0;}
.tfMoreLbl{font-size:12px;font-weight:800;color:var(--sub);margin:0 2px 6px;}
.tfMore .sentBox.inRow{margin:0;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d7dce3;border-radius:4px;}
</style>
</head>

// earlier version of this file did) turns ' into the entity &#39; before
// the JS-escape step ever runs, so the JS-escape regex finds nothing to
// escape — the browser then HTML-decodes &#39; back into a raw, unescaped
// ' when parsing the attribute, which terminates the JS string early and

    const base = multi ? spokenText(rawText) : canonicalWord(rawText);
    if (currentAudioEl) { releaseAudio(currentAudioEl); currentAudioEl = null; }

    // "real" setting: Commons recordings first, generated MP3 as the backup

    // synchronously here so Safari accepts it as gesture-initiated.

    // type, etc.) never fire an 'error' event at all, which would otherwise
    // leave a word completely silent forever. This guarantees every word

    // 2.5 s to find a recording; once one is found (metadata loaded) give
    // it extra time to start, since a first, uncached load can be slow
    // room for a few missing-file checks plus the site's own MP3
    deadline = setTimeout(() => fallbackNow("timed out"), 4000);

}

function recordActivity(n, kind) {
  n = n || 1;
  STATE.daily = rollDaily(STATE.daily);
  const today = todayStr();
  const newCount = STATE.daily.todayCount + n;
  const history = { ...(STATE.daily.history || {}) };
  history[today] = (history[today] || 0) + n;
  let streak = STATE.daily.streak, countedToday = STATE.daily.countedToday, hit = false;
  if (!countedToday && newCount >= DAILY_GOAL) { streak++; countedToday = true; hit = true; }
  STATE.daily = { ...STATE.daily, todayCount: newCount, streak, countedToday, bestStreak: Math.max(STATE.daily.bestStreak || 0, streak), history };
  saveDaily();
  const missionMsg = bumpMission(kind);
  if (hit) { showToast(`🎉 完成今日目標！連續 ${streak} 天`); setTimeout(() => celebrate("🎯 今日目標達成！"), 450); }
  else if (missionMsg) showToast(missionMsg);
  checkBadges();
}

function checkBadges() {
  const stats = computeStats();
  const earned = BADGES.filter((b) => !STATE.daily.badges.includes(b.id) && b.test(stats, STATE.daily));
  if (earned.length) {
    STATE.daily = { ...STATE.daily, badges: [...STATE.daily.badges, ...earned.map((b) => b.id)] };
    saveDaily();
    showToast(`${earned[0].emoji} 獲得新貼紙：${earned[0].label}！`);
  }
}

function computeStats() {
  const byCat = {};
  CATEGORIES.forEach((c) => (byCat[c.key] = { total: 0, mastered: 0, weighted: 0, studied: 0 }));
  let masteredCount = 0, studiedCount = 0, weightedSum = 0;
  WORDS.forEach((w) => {
    const lv = (STATE.progress[w.id] || {}).level || 0;
    byCat[w.cat].total++;
    byCat[w.cat].weighted += lv;
    if (lv >= 4) { masteredCount++; byCat[w.cat].mastered++; }
    if (lv > 0) { studiedCount++; byCat[w.cat].studied++; }
    weightedSum += lv;
  });
  return {
    total: WORDS.length, masteredCount, masteredPct: WORDS.length ? masteredCount / WORDS.length : 0,
    studiedCount, avgLevel: WORDS.length ? weightedSum / WORDS.length : 0, byCat,
  };
}

/* ---------- backup: export / import progress as a code ----------
   All four apps live on the same site, so one code carries everything:
   progress, daily record and best score of each app, plus accent and sound
   source. Format: "YLE1-" + base64(JSON). Import overwrites only the keys the
   code contains, then reloads the page. */
const BACKUP_APPS = [
  ["movers-vocab", "Movers"], ["starters-vocab", "Starters"], ["flyers-vocab", "Flyers"], ["ket-vocab", "KET"], ["pet-vocab", "PET"], ["phonics", "自然發音"],
];
const BACKUP_KEYS = BACKUP_APPS.flatMap(([p]) => [`${p}-progress-v1`, `${p}-hiscore-v1`, `${p}-daily-v1`])
  .concat(["yle-accent-v1", "yle-sound-source-v1", "yle-autoplay-v1"]);
function exportProgressCode() {
  const d = {};
  BACKUP_KEYS.forEach((k) => { try { const v = localStorage.getItem(k); if (v !== null) d[k] = v; } catch (e) {} });
  const json = JSON.stringify({ v: 1, t: new Date().toISOString(), d });
  return "YLE1-" + btoa(unescape(encodeURIComponent(json)));
}
function parseProgressCode(code) {
  const c = String(code || "").replace(/\s+/g, "");
  if (!c.startsWith("YLE1-")) throw new Error("這不是進度代碼（應該以 YLE1- 開頭）");
  let obj;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(c.slice(5))))); }
  catch (e) { throw new Error("代碼不完整，請確認整段都有複製到"); }
  if (!obj || obj.v !== 1 || !obj.d || typeof obj.d !== "object") throw new Error("代碼格式不正確");
  return obj;

/* ---------- shared: build a session queue that mixes unseen + weak + strong
   words, so a session never ends up only cycling "not familiar" repeats ---------- */
function buildWeightedQueue(pool, target) {
  target = Math.min(target, pool.length);
  const withLevel = pool.map((w) => ({ w, lv: (STATE.progress[w.id] || {}).level || 0 }));
  const unseen = shuffle(withLevel.filter((x) => x.lv === 0).map((x) => x.w));
  const weak = shuffle(withLevel.filter((x) => x.lv === 1 || x.lv === 2).map((x) => x.w));
  const strong = shuffle(withLevel.filter((x) => x.lv >= 3).map((x) => x.w));
  let queue = [];
  const take = (arr, n) => { const t = arr.splice(0, n); queue = queue.concat(t); };
  // roughly 60% of the session introduces new/unseen words, the rest reinforces weak ones
  take(unseen, Math.ceil(target * 0.6));
  take(weak, target - queue.length);
  take(unseen, target - queue.length);
  take(strong, target - queue.length);
  if (queue.length < target) {
    const used = new Set(queue.map((w) => w.id));
    const rest = shuffle(pool.filter((w) => !used.has(w.id)));
    queue = queue.concat(rest.slice(0, target - queue.length));
  }
  return shuffle(queue);
}

/* ---------- swipe a flashcard: right = 會了, left = 再練練 ---------- */
let swipeSuppressClick = false;
function attachSwipe() {
  const el = document.getElementById("fcInner");
  const wrap = document.getElementById("cardWrap");
  if (!el || !wrap) return;
  const yes = wrap.querySelector(".swipeTag.yes"), no = wrap.querySelector(".swipeTag.no");
  let sx = 0, sy = 0, dx = 0, down = false, moving = false;
  const reset = () => {
    wrap.style.transition = "transform .2s ease"; wrap.style.transform = "";
    if (yes) yes.style.opacity = 0; if (no) no.style.opacity = 0;
  };
  el.addEventListener("pointerdown", (e) => { down = true; moving = false; sx = e.clientX; sy = e.clientY; dx = 0; wrap.style.transition = "none"; });
  el.addEventListener("pointermove", (e) => {
    if (!down) return;
    dx = e.clientX - sx;
    const dy = e.clientY - sy;
    if (!moving && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { moving = true; try { el.setPointerCapture(e.pointerId); } catch (err) {} }
    if (!moving) return;
    wrap.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    if (yes) yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
    if (no) no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!down) return;
    down = false;
    if (!moving) return;
    swipeSuppressClick = true;
    setTimeout(() => { swipeSuppressClick = false; }, 80);
    if (Math.abs(dx) < 90) { reset(); return; }
    const right = dx > 0;
    wrap.style.transition = "transform .22s ease-in, opacity .22s ease-in";
    wrap.style.transform = `translateX(${right ? 520 : -520}px) rotate(${right ? 22 : -22}deg)`;
    wrap.style.opacity = "0";
    rateStudyCard(right ? 3 : 1, true);
  };
  // On a touch screen finish the swipe on touchend: iPhone only lets the next
  // card's sound start inside touchend / click, not inside pointerup.
  el.addEventListener("pointerup", (e) => { if (e.pointerType === "touch" && "ontouchend" in window) return; end(); });
  el.addEventListener("touchend", end);
  el.addEventListener("pointercancel", () => { if (down && moving) { down = false; reset(); } down = false; });
}

/* ============================================================
   QUIZ
   ============================================================ */
/* ---------- tests: entries with two words are asked as two words ----------
   "tooth / teeth" becomes two questions (tooth, teeth). Both keep the same id,
   so progress still counts toward the one entry, and a word's own pair never
   appears as a wrong option. Spelling variants that sound the same
   (gray / grey, practice / practise) stay one question. */
const SPLIT_ZH = {
  "Ann / Anna": ["安（女子名）", "安娜（女子名）"],
  "businessman/woman": ["商人（男）", "女商人"],
  "city / town centre": ["市中心", "鎮中心"],
  "television / TV": ["電視", "電視（縮寫）"],
  "take a photo / picture": ["拍照", "拍照"],
};
function expandForTest(pool) {
  const out = [];
  pool.forEach((w) => {
    const forms = spokenForms(w.en);
    if (forms.length < 2) { out.push(w); return; }
    const zhs = SPLIT_ZH[w.en] || forms.map((f, i) => (i === 0 ? w.zh : `${w.zh}（複數）`));
    forms.forEach((f, i) => out.push({ ...w, en: f, zh: zhs[i] || w.zh, splitFrom: w.en }));
  });
  return out;
}
/* Question types:
   "en"     – see (and hear) the English word, pick the Chinese meaning
   "listen" – only hear the word (it is hidden until answered), pick the Chinese meaning
   "pic"    – see and hear the English word, pick the matching picture (nouns with a picture only) */
const QUIZ_PIC_OK = (w) => /^n/.test(w.pos) && !!wordImgUrl(w.en, w.pos);
function quizWordKey(w) { return canonicalWord(w.splitFrom || w.en).toLowerCase(); }
// Distractors that cannot be ruled out by part of speech alone: prefer the
// same part of speech, then the same topic, with some randomness so rounds vary.
// Never two options with the same Chinese meaning (or the same picture).
function quizDistractors(w, pool, n, type) {
  const ok = (x) => x.id !== w.id && quizWordKey(x) !== quizWordKey(w) && (type !== "pic" || QUIZ_PIC_OK(x));
  const rank = (list) => shuffle(list.filter(ok))
    .map((x) => ({ x, s: (x.pos === w.pos ? 2 : 0) + (x.cat === w.cat ? 1 : 0) + Math.random() * 1.5 }))
    .sort((a, b) => b.s - a.s)
    .map((r) => r.x);
  const seenZh = new Set([w.zh]);
  const seenImg = new Set([wordImgUrl(w.en, w.pos)]);
  const out = [];
  const take = (list) => {
    for (const x of list) {
      if (out.length >= n) break;
      if (seenZh.has(x.zh)) continue;
      if (type === "pic") { const u = wordImgUrl(x.en, x.pos); if (seenImg.has(u)) continue; seenImg.add(u); }
      seenZh.add(x.zh);
      out.push(x);
    }
  };
  take(rank(pool));
  // a small category / letter may not have enough look-alikes: top up from the whole list
  if (out.length < n) take(rank(expandForTest(WORDS)));
  return out;
}
function quizPickType(w, qi) {
  const types = ["en", "en", "listen"];
  if (QUIZ_PIC_OK(w)) types.push("pic", "pic");
  // the first question is always the familiar kind
  return qi === 0 ? "en" : types[Math.floor(Math.random() * types.length)];
}
function buildQuizQuestions(sel) {
  let pool = expandForTest(poolForSelection(sel));
  if (pool.length < 4) pool = expandForTest(WORDS);
  const chosen = buildWeightedQueue(pool, QUIZ_LEN);
  return chosen.map((w, qi) => {
    let type = quizPickType(w, qi);
    let distractors = quizDistractors(w, pool, 3, type);
    if (distractors.length < 3 && type === "pic") { type = "en"; distractors = quizDistractors(w, pool, 3, type); }
    const options = shuffle([w, ...distractors]);
    return { word: w, options, type };
  });
}
// a "listen" question speaks by itself when it appears. From a tap (start
// button) or the timer after an answer, the shared auto-audio element is used,
// which every earlier tap has already unlocked on iPhone.
function quizAutoPlay() {
  const qz = STATE.quiz;

function startQuiz(mode, value) {
  const sel = { mode, cat: mode === "cat" ? value : "all", letter: mode === "letter" ? value : "A" };
  STATE.quiz = { ...sel, phase: "playing", questions: buildQuizQuestions(sel), qi: 0, score: 0, streak: 0, picked: null, correctCount: 0 };

function chooseQuizOption(optId) {

  const curLv = (STATE.progress[q.word.id] || {}).level || 0;
  if (isCorrect) {
    const bonus = Math.min(qz.streak * 2, 10);
    qz.score += 10 + bonus;
    qz.streak += 1;
    qz.correctCount += 1;
    updateWord(q.word.id, { level: Math.min(4, curLv + 1), correct: ((STATE.progress[q.word.id] || {}).correct || 0) + 1 });

  }
  recordActivity(1, "quiz");
  render();
  if (isCorrect) { fxCorrect(qz.streak); celebrate(praiseFor(qz.streak)); } else fxWrong();
  // listen / picture questions reveal the English word now; give a moment longer to read it
  const wait = q.type === "en" ? 900 : isCorrect ? 1300 : 1900;
  setTimeout(() => {

/* ============================================================
   SPELL (listen and type the word)
   ============================================================ */
const SPELL_LEN = 10;
function buildSpellQueue(sel) {
  return buildWeightedQueue(expandForTest(poolForSelection(sel)), SPELL_LEN);
}
function startSpell(mode, value) {
  const sel = { mode, cat: mode === "cat" ? value : "all", letter: mode === "letter" ? value : "A" };
  STATE.spell = { ...sel, phase: "playing", queue: buildSpellQueue(sel), idx: 0, input: "", feedback: null, hintLevel: 0, revealedPositions: [], score: 0, streak: 0, correctCount: 0 };
  render();
  const w = STATE.spell.queue[0];
  if (w) setTimeout(() => pronounce(w.en), 350);
}
function onSpellInput(val) {
  STATE.spell.input = val;
}
function onSpellKeydown(e) {
  if (e.key === "Enter") submitSpell();
}
function replaySpellWord(slow) {
  const w = STATE.spell.queue[STATE.spell.idx];
  if (w) pronounce(w.en, slow);
}
function normalizeSpelling(s) {
  return s
    .normalize("NFKC")
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}
function pickRandomHintPositions(answer, alreadyRevealed, count) {
  const candidates = [];
  for (let i = 0; i < answer.length; i++) {
    if (/[a-zA-Z]/.test(answer[i]) && !alreadyRevealed.includes(i)) candidates.push(i);
  }
  const picked = shuffle(candidates).slice(0, count);
  return picked;
}
function hintedBlanksFromPositions(answer, revealedPositions) {
  let out = "";
  for (let i = 0; i < answer.length; i++) {
    const ch = answer[i];
    if (/[a-zA-Z]/.test(ch)) {
      out += revealedPositions.includes(i) ? ch : "＿";
    } else {
      out += ch;
    }
  }
  return out.split("").join(" ");
}
function resolveSpell(isCorrect) {
  const sp = STATE.spell;
  const w = sp.queue[sp.idx];
  sp.feedback = isCorrect ? "correct" : "wrong";
  const curLv = (STATE.progress[w.id] || {}).level || 0;
  if (isCorrect) {
    const bonus = Math.min(sp.streak * 2, 10);
    sp.score += 10 + bonus;
    sp.streak += 1;
    sp.correctCount += 1;
    updateWord(w.id, { level: Math.min(4, curLv + 1), correct: ((STATE.progress[w.id] || {}).correct || 0) + 1 });
  } else {
    sp.streak = 0;
    updateWord(w.id, { level: Math.max(1, curLv - 1), wrong: ((STATE.progress[w.id] || {}).wrong || 0) + 1 });
  }
  recordActivity(1, "spell");
  render();
  if (isCorrect) { fxCorrect(sp.streak); celebrate(praiseFor(sp.streak)); } else fxWrong();
  setTimeout(() => {
    if (sp.idx + 1 >= sp.queue.length) {
      sp.phase = "done";
    } else {
      sp.idx += 1;
      sp.input = "";
      sp.feedback = null;
      sp.hintLevel = 0;
      sp.revealedPositions = [];
      const nextW = sp.queue[sp.idx];
      if (nextW) setTimeout(() => pronounce(nextW.en), 300);
    }
    render();
    if (sp.phase === "playing") {
      const el = document.getElementById("spellInput");
      if (el) el.focus();
    }
  }, isCorrect ? 1100 : 2000);
}
function submitSpell() {
  const sp = STATE.spell;
  if (sp.feedback) return; // already answered, waiting to advance
  const w = sp.queue[sp.idx];
  const answers = [canonicalWord(w.en)].concat(spokenForms(w.en)).map(normalizeSpelling);
  const given = normalizeSpelling(sp.input || "");
  const isCorrect = given.length > 0 && answers.includes(given);
  resolveSpell(isCorrect);
}
function hintSpell() {
  const sp = STATE.spell;
  if (sp.feedback) return;
  if (sp.hintLevel >= 2) {
    // asked for a hint a 3rd time — treat as "I don't know" and mark it wrong
    resolveSpell(false);
    return;
  }
  const w = sp.queue[sp.idx];
  const answer = canonicalWord(w.en);
  const count = 1 + Math.floor(Math.random() * 2); // reveal 1 or 2 random letters
  const newPositions = pickRandomHintPositions(answer, sp.revealedPositions || [], count);
  sp.revealedPositions = (sp.revealedPositions || []).concat(newPositions);
  sp.hintLevel += 1;
  render();
  const el = document.getElementById("spellInput");
  if (el) el.focus();
}

/* ============================================================

    const items = (doc && doc.sentences) || {};

    const map = {};
    WORDS.forEach((w) => {
      // match by id, but trust the word text if the list order ever changes
      const s = items[w.id] && items[w.id].word === w.en ? items[w.id] : byWord[w.en];
      if (s && s.en) map[w.id] = s;

// the sentence with the target word underlined (case-insensitive, first match)

  try { if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); } catch (e) {}

/* ============================================================
   對或錯 (picture + sentence: true or false?)
   Like Starters/Movers Reading & Writing: look at the picture, read the
   sentence, decide if they match. The sentence is the word's picture caption
   ("pic" in the data), which says only what the picture shows; for a "false"
   item the picture is a different word's. The example sentence is shown
   after answering. Wrong answers come back once later in the round.
   ============================================================ */
const TF_LEN = 10;

const TF_CATS = ["animals", "body", "clothes", "food", "home", "places", "school", "jobs", "sports", "weather", "time", "nature"];
// words that look alike in a small picture never stand in for each other
const TF_CONFUSABLE = [
  ["city", "city / town centre", "town", "village", "centre"],
  ["shop", "market", "supermarket", "shopping centre"],
  ["pool", "swimming pool", "lake", "river", "waterfall"],
  ["forest", "jungle"], ["field", "grass", "ground", "countryside", "farm"],
  ["station", "bus station", "bus stop"], ["cup", "glass", "bottle", "coffee", "tea", "sauce", "milkshake"], ["plate", "bowl", "soup"],
  ["salad", "vegetable"], ["doctor", "nurse"], ["CD", "DVD"], ["town", "village", "countryside", "city"],
  ["cloud", "cloudy", "rain", "snow", "sky", "weather"], ["wind", "windy"], ["sunny", "sky"],
  ["week", "weekend"], ["sweater", "coat"], ["film star", "pop star"], ["café", "cinema"],
  ["ice skates", "ice skating", "skate", "roller skates", "roller skating"],

  if (TF_CONFUSABLE.some((g) => g.includes(a.en) && g.includes(b.en))) return true;
  const ta = tfTokens(a.en), tb = tfTokens(b.en);
  // tooth / toothache, rain / rainbow, bus stop / bus station ...
  return ta.some((x) => tb.some((y) => x.includes(y) || y.includes(x)));

  const s = sentFor(w);

}
function tfPickDistractor(w) {
  const mine = wordImgUrl(w.en, w.pos);
  const sent = sentFor(w).pic.toLowerCase();
  const ok = (x) => x.id !== w.id && tfEligible(x) && wordImgUrl(x.en, x.pos) !== mine
    && !tfConfusable(w, x)
    && !tfTokens(x.en).some((t) => sent.includes(t)); // the sentence must not also mention the picture
  let pool = WORDS.filter((x) => ok(x) && x.cat === w.cat);

  if (sw.pfalse && Math.random() < 0.5) return { word: w, truth: false, pic: w, kind: "pfalse" };

const TF_LISTEN_KEY = "yle-tf-listen-v1";

  const pool = WORDS.filter(tfEligible);
  const words = buildWeightedQueue(pool, TF_LEN);

      <div class="sumStars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <div style="font-weight:800;font-size:18px;">${stars === 3 ? "太厲害了！" : stars === 2 ? "做得很好！" : "多玩幾次會越來越厲害！"}</div>
      <div style="font-size:13px;color:var(--sub);margin-top:6px;">答對 ${t.correct} 題（共 ${t.answered} 題）</div>
      <div class="ctaRow" style="margin-top:16px;"><button class="cta" style="background:var(--accent);" onclick="startTf()">🔁 再玩一次</button><button class="cta" style="background:#8592A6;" onclick="STATE.tf.phase='setup';render();">換模式</button></div>
    </div></div>`;
  }
  const it = t.queue[t.idx];
  const s = sentFor(it.word);
  const qText = it.kind === "pfalse" ? s.pfalse : s.pic;
  const answered = !!t.answer;
  const total = t.queue.length;
  return `<div class="pad">
    <div class="sessBar"><div class="sessTrack"><div class="sessFill" style="width:${Math.round((t.idx + (answered ? 1 : 0)) / total * 100)}%"></div></div><div class="sessTxt">第 ${t.idx + 1} / ${total} 題</div></div>
    <div class="tfCard ${answered ? "done " + (t.answer === "right" ? "pop" : "shake") : "cardEnter"}">
      <div class="tfPic">${wordImgHtml(it.pic.en, 120, "", it.pic.pos)}
        ${answered ? `<div class="tfStamp ${it.truth ? "yes" : "no"}">${it.truth ? "✓" : "✗"}</div>` : ""}
      </div>
      ${t.countdown
        ? `<div class="tfCount" aria-live="assertive"><span>${t.countdown}</span><small>準備聽…</small></div>`
        : t.listen && !answered
        ? `<div class="tfHidden">🎧 仔細聽，句子跟圖一樣嗎？</div>`
        : `<div class="tfSent">${picHtml(it.word, s, qText)}</div>`}
      ${t.countdown ? "" : `<div class="tfListen">${sentBtnsHtml(it.word.id, t.listen && !answered ? 56 : 44, "", "", it.kind)}</div>`}
    </div>
    ${answered ? `
      <div class="tfFeedback ${t.answer}">
        <div class="tfFbTitle">${t.answer === "right" ? "答對了！🎉" : "再看一次喔 💪"}</div>
        ${it.truth
          ? `<div class="tfFbBody">句子跟圖一樣，所以是「對」。</div><div class="tfFbZh">${escapeHtml(s.pzh || "")}</div>`
          : it.kind === "pfalse"
          ? `<div class="tfFbBody">句子裡有一個地方跟圖不一樣，圖裡其實是：</div>
             <div class="tfFbFix"><span>${picHtml(it.word, s, s.pic)}</span>${sentBtnsHtml(it.word.id, 34, "", "", "pic")}</div>
             <div class="tfFbZh">${escapeHtml(s.pzh || "")}</div>`
          : `<div class="tfFbBody">圖裡是 <b>${escapeHtml(it.pic.en)}</b>（${escapeHtml(it.pic.zh)}），句子說的是：</div>
             <div class="tfFbWord">${wordImgHtml(it.word.en, 44, "", it.word.pos)}<span><b>${escapeHtml(it.word.en)}</b> ${escapeHtml(it.word.zh)}</span></div>`}
      </div>
      <button class="bigCta" style="margin-top:12px;" onclick="nextTf()">${t.idx + 1 >= total ? "看結果 →" : "下一題 →"}</button>
      <div class="tfMore"><div class="tfMoreLbl">再學一句（例句）</div>${sentBoxHtml(it.word, { cls: "inRow", size: 36 })}</div>`
    : `
      <div class="tfBtns">
        <button class="tfBtn yes" ${t.countdown ? "disabled" : ""} onclick="answerTf(true)">✓ 對</button>
        <button class="tfBtn no" ${t.countdown ? "disabled" : ""} onclick="answerTf(false)">✗ 不對</button>
      </div>`}
  </div>`;
}

function bodyHtml() {
  if (STATE.tab === "home") return renderHome();
  if (STATE.tab === "browse") return renderBrowse();
  if (STATE.tab === "study") return renderStudy();
  if (STATE.tab === "tf") return renderTf();
  if (STATE.tab === "spell") return renderSpell();
  if (STATE.tab === "quiz") return renderQuiz();
  return "";
}
function render() {
  const root = document.getElementById("app");
  root.innerHTML = `
    ${headerHtml()}
    <div class="body">${bodyHtml()}</div>
    ${tabBarHtml()}
    <div id="toastHost">${STATE.toast ? `<div class="toast">${escapeHtml(STATE.toast)}</div>` : ""}</div>
    ${settingsSheetHtml()}
    ${stickerViewHtml()}
  `;
  if (STATE.tab === "browse") updateBrowseList();
  if (STATE.tab === "study") attachSwipe();
}

// load voices ahead of time (some browsers populate this list async);
// clear the cached choice so pickBestVoice() re-evaluates once the full list is in
if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    cachedVoice = null;
    dbg(`聲音清單更新：${usableEnglishVoices().map((v) => v.name + "|" + v.lang).join(", ")}；自動選 ${voiceDesc(pickBestVoice())}`);
    window.speechSynthesis.getVoices();
    if (STATE.tab === "home") render();
  };
}

render();
loadSentences();
dbg(`除錯模式 ${navigator.userAgent.replace(/^Mozilla\/5.0 /, "")}`);
dbg(`錄音索引：${recIndexSummary()}`);
if (SOUND_SOURCE === "real") setTimeout(buildRecordingIndex, 1500);
dbg(`英文聲音 ${usableEnglishVoices().map((v) => v.name + "|" + v.lang).join(", ") || "0 個"}；自動選 ${voiceDesc(pickBestVoice())}，手動選 ${(STATE.voicePref && STATE.voicePref.voiceURI) || "無"}`);
</script>
</body>
</html>
