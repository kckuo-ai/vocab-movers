<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Starters 單字護照</title>
<style>
:root{
  --blue:#4361EE; --teal:#2EC4B6; --ink:#233047; --sub:#8592A6;
  --bg:#F6F8FC; --card:#ffffff; --border:#E4E8F0; --track:#EEF1F7;
  --green:#06D6A0; --amber:#FFB703; --red:#EF476F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.header{
  background:linear-gradient(135deg,#4361EE 0%,#2EC4B6 100%);
  color:#fff;padding:22px 20px 26px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;
  box-shadow:0 8px 24px rgba(67,97,238,.25);
  position:relative;
}
.appSwitch{position:absolute;top:20px;right:18px;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:11px;font-weight:800;padding:6px 11px;border-radius:999px;white-space:nowrap;}
.htag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;margin-bottom:8px;}
.htitle{font-weight:800;font-size:24px;letter-spacing:.3px;}
.hsub{font-size:13px;opacity:.9;margin-top:3px;font-weight:600;}
.body{flex:1;overflow-y:auto;padding-bottom:84px;}
.pad{padding:16px 18px 6px;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(35,48,71,.06);z-index:40;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;position:relative;color:#8592A6;}
.tabbtn.active{color:var(--blue);}
.tabbtn .emo{font-size:20px;}
.tabbtn .lbl{font-size:11px;font-weight:800;margin-top:2px;}
.tabbtn .dot{position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:90%;text-align:center;}
.card{background:#fff;border-radius:16px;}
.sectionTitle{font-weight:800;font-size:15px;margin:16px 0 10px;}
.speakBtn{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#EEF1FB;color:var(--blue);}
/* mascot */
.mascotWrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;}
.owl{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 6px 14px rgba(35,48,71,.1);}
.bubble{flex:1;background:#fff;border-radius:16px;padding:10px 14px;font-size:12.5px;font-weight:700;color:#4A5568;box-shadow:0 6px 14px rgba(35,48,71,.06);}
.streakBadge{position:absolute;top:-8px;right:-4px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;box-shadow:0 4px 10px rgba(255,183,3,.4);}
/* daily goal */
.dailyCard{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px;}
.dailyTop{display:flex;justify-content:space-between;margin-bottom:7px;}
.barTrack{height:7px;background:var(--track);border-radius:999px;overflow:hidden;}
.barFill{height:100%;border-radius:999px;transition:width .4s ease;}
.dailyStreakRow{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--sub);}
/* word of day */
.wodCard{border-radius:18px;padding:14px 16px;color:#fff;margin-bottom:18px;box-shadow:0 10px 22px rgba(35,48,71,.14);}
.wodLabel{font-size:11px;font-weight:800;opacity:.9;margin-bottom:6px;}
.wodRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.wodEn{font-weight:800;font-size:24px;word-break:break-word;}
.wodZh{font-size:12.5px;opacity:.92;margin-top:3px;font-weight:700;}
.wodFooter{font-size:11px;opacity:.85;margin-top:10px;font-weight:700;}
/* badges */
.badgeGrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.badge{width:78px;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 4px 10px rgba(35,48,71,.06);}
.badge.locked{opacity:.5;}
.badge .emo{font-size:22px;margin-bottom:3px;}
.badge .lbl{font-size:9.5px;font-weight:800;color:#5B6779;line-height:1.2;}
/* ring */
.ring{position:relative;width:132px;height:132px;margin:6px auto 4px;}
.ringCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.statRow{display:flex;gap:10px;margin:16px 0 22px;}
.chip{flex:1;background:#fff;border:1.5px solid;border-radius:14px;padding:10px 4px;text-align:center;}
.chip .val{font-weight:800;font-size:18px;}
.chip .lbl{font-size:10.5px;color:var(--sub);font-weight:700;margin-top:1px;}
.catRow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;}
.catIcon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.catTop{display:flex;justify-content:space-between;margin-bottom:5px;}
.ctaRow{display:flex;gap:10px;margin-top:20px;}
.cta{flex:1;border:none;color:#fff;font-weight:800;font-size:14px;padding:13px 0;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.12);}
/* browse */
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);font-size:14px;outline:none;margin-bottom:12px;}
.chipRow{display:flex;flex-wrap:wrap;}
.catChip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:#5B6779;font-weight:800;font-size:12.5px;margin-right:7px;margin-bottom:7px;white-space:nowrap;}
.catChip.active{}
.rowCard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:8px;}
.rowHead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;}
.rowDot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rowBody{padding:0 12px 12px;}
.levelBtnRow{display:flex;gap:6px;}
.levelBtn{flex:1;border:none;border-radius:10px;padding:8px 2px;font-size:11px;font-weight:800;}
/* study */
.cardWrap{perspective:1200px;margin-top:8px;}
.flashcard{position:relative;height:230px;border-radius:22px;box-shadow:0 14px 30px rgba(35,48,71,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;color:#fff;text-align:center;cursor:pointer;}
.flashcard.back{background:#fff;border:1.5px solid #EEF1F7;color:var(--ink);}
.fcTab{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;}
.fcTab.backTab{background:var(--tabbg,#EEE);}
.fcPos{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;opacity:.85;}
.fcEn{font-weight:800;font-size:30px;margin-top:6px;word-break:break-word;}
.fcZh{font-size:20px;font-weight:800;color:var(--ink);margin-top:10px;}
.fcHint{position:absolute;bottom:16px;font-size:11px;opacity:.85;font-weight:700;}
.rateRow{display:flex;gap:8px;margin-top:18px;}
.rateBtn{flex:1;border:none;border-radius:14px;padding:10px 2px;color:#fff;}
.emptyWrap{text-align:center;padding:50px 10px;}
/* quiz */
.introCard{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;}
.qzTopRow{display:flex;gap:8px;margin-bottom:14px;}
.qzPill{flex:1;text-align:center;background:#EEF1FB;color:var(--blue);font-weight:800;font-size:11.5px;padding:7px 4px;border-radius:999px;}
.qCard{border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 10px 24px rgba(35,48,71,.15);color:#fff;}
.qOption{text-align:left;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;font-weight:700;background:#fff;width:100%;color:var(--ink);}
.qOption.correct{background:#E9F7EF;border-color:var(--green);color:#177350;}
.qOption.wrong{background:#FDECEE;border-color:var(--red);color:#B3223F;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#d7dce3;border-radius:4px;}

</head>

function lget(key, fallback) {

/* ---------- date / streak helpers ---------- */
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}
function rollDaily(d) {
  const today = todayStr();
  if (d.date === today) return d;
  const gap = daysBetween(d.date, today);
  const keepStreak = gap === 1 && d.countedToday;
  return { ...d, date: today, todayCount: 0, countedToday: false, streak: keepStreak ? d.streak : 0 };
}
function getWordOfDay() {
  const key = todayStr();
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  return WORDS[hash % WORDS.length];
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- pronunciation (built into iOS/Safari, no internet needed) ----------
   No manual picker — automatically choose the most natural-sounding available
   voice using a quality heuristic, and cache it so selection stays consistent. */
const PREFERRED_VOICE_NAMES = [
  "Samantha", "Ava", "Allison", "Susan", "Nicky", "Zoe", "Evan",
  "Karen", "Moira", "Tessa", "Daniel", "Serena", "Kate", "Stephanie", "Aaron",
];
let cachedVoice = null;
function pickBestVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  const en = voices.filter((v) => v.lang && v.lang.startsWith("en"));
  if (!en.length) return null;
  // 1) explicit high-quality hints exposed by some platforms
  let v = en.find((v) => /premium|enhanced|neural/i.test(v.name) || /premium|enhanced|neural/i.test(v.voiceURI));
  if (v) return v;
  // 2) known natural-sounding default voices (macOS/iOS), en-US preferred
  for (const name of PREFERRED_VOICE_NAMES) {
    v = en.find((vv) => vv.name === name && vv.lang === "en-US");
    if (v) return v;
  }
  for (const name of PREFERRED_VOICE_NAMES) {
    v = en.find((vv) => vv.name.includes(name));
    if (v) return v;
  }
  // 3) fall back to any en-US / en-GB voice, then any English voice
  return en.find((v) => v.lang === "en-US") || en.find((v) => v.lang === "en-GB") || en[0];
}
function canonicalWord(raw) {
  // strip parenthetical content with proper depth-tracking so nested
  // parens (e.g. "candy (sweet(s))") are fully removed, not just to the
  // first closing paren — a naive regex here breaks spelling checks
  let out = "", depth = 0;
  for (const ch of raw) {
    if (ch === "(") { depth++; continue; }
    if (ch === ")") { if (depth > 0) depth--; continue; }
    if (depth === 0) out += ch;
  }
  return out.replace(/\/.*/g, "").trim();
}
// manual respelling overrides for words a device's TTS voice mispronounces —
// add more here (lowercase key) if other words still sound wrong after testing
const PRONOUNCE_OVERRIDES = {
  cook: "kuk",
};
function speakTextFor(rawText) {
  const base = canonicalWord(rawText);
  const override = PRONOUNCE_OVERRIDES[base.toLowerCase()];
  const text = override || base;
  // ending punctuation gives many TTS engines natural sentence-final
  // intonation instead of a clipped/odd reading of an isolated short word
  return /[.!?]$/.test(text) ? text : text + ".";
}
function speak(rawText) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(speakTextFor(rawText));
    utter.rate = 0.93; // natural-ish pace, still clear enough for kids
    utter.pitch = 1.0;
    if (!cachedVoice) cachedVoice = pickBestVoice();
    if (cachedVoice) { utter.voice = cachedVoice; utter.lang = cachedVoice.lang; } else { utter.lang = "en-US"; }
    window.speechSynthesis.speak(utter);
  } catch (e) {
    console.error("speak failed", e);
  }
}

/* ---------- natural-sounding pronunciation, with automatic fallback to
   the device's own speech synthesis ----------
   Earlier this used dictionaryapi.dev's audio links, but that service's
   audio hosting turns out to have known, ongoing reliability problems
   (broken/dead links reported by many other developers) — so results were
   inconsistent. This uses Google Translate's TTS endpoint instead: the
   audio URL is built directly from the text with no network lookup step
   first, so playback can start fully synchronously inside the tap handler
   (exactly what Safari's autoplay-needs-a-gesture rule requires — no more
   racing an async request against the gesture window), and it also works
   for whole phrases, not just single dictionary words. */
let currentAudioEl = null;
function ttsAudioUrl(text) {
  return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(text)}`;
}
function pronounce(rawText) {
  const base = canonicalWord(rawText);
  if (currentAudioEl) { try { currentAudioEl.pause(); } catch (e) {} }
  let fellBack = false;
  const fallback = (reason) => {
    if (fellBack) return;
    fellBack = true;
    console.warn(`pronounce: "${base}" fell back to device voice — ${reason}`);
    showToast(`🔈 系統語音（${reason}）`);
    speak(rawText);
  };
  try {
    const audioEl = new Audio(ttsAudioUrl(base));
    currentAudioEl = audioEl;
    audioEl.addEventListener("error", () => {
      const codes = { 1: "已中止", 2: "網路錯誤", 3: "解碼失敗", 4: "來源不支援/被拒絕" };
      const code = audioEl.error && audioEl.error.code;
      fallback(codes[code] || "音訊載入錯誤");
    });
    const p = audioEl.play();
    if (p && p.catch) p.catch((e) => fallback("播放被擋：" + (e && e.name ? e.name : "未知")));
  } catch (e) {
    fallback("例外：" + (e && e.message ? e.message : "未知"));
  }
}
function speakBtnHtml(text, size, tone, bg) {
  size = size || 34; tone = tone || "#4361EE"; bg = bg || "#EEF1FB";
  return `<button class="speakBtn" style="width:${size}px;height:${size}px;background:${bg};color:${tone};font-size:${size*0.48}px;" onclick="event.stopPropagation();pronounce('${escapeHtml(text).replace(/'/g,"\\'")}')" aria-label="播放發音">🔊</button>`;
}

function showToast(msg) {
  STATE.toast = msg;
  renderToastOnly();
  if (STATE.toastTimer) clearTimeout(STATE.toastTimer);
  STATE.toastTimer = setTimeout(() => { STATE.toast = null; renderToastOnly(); }, 1700);
}
function renderToastOnly() {
  const el = document.getElementById("toastHost");
  if (el) el.innerHTML = STATE.toast ? `<div class="toast">${escapeHtml(STATE.toast)}</div>` : "";
}

function updateWord(id, patch) {
  const cur = STATE.progress[id] || { level: 0, seen: 0, correct: 0, wrong: 0 };
  STATE.progress[id] = { ...cur, ...patch };
  saveProgress();
  checkBadges();
}

function recordActivity(n) {
  n = n || 1;
  STATE.daily = rollDaily(STATE.daily);
  const today = todayStr();
  const newCount = STATE.daily.todayCount + n;
  const history = { ...(STATE.daily.history || {}) };
  history[today] = (history[today] || 0) + n;
  let streak = STATE.daily.streak, countedToday = STATE.daily.countedToday, hit = false;
  if (!countedToday && newCount >= DAILY_GOAL) { streak++; countedToday = true; hit = true; }
  STATE.daily = { ...STATE.daily, todayCount: newCount, streak, countedToday, bestStreak: Math.max(STATE.daily.bestStreak || 0, streak), history };
  saveDaily();
  if (hit) showToast(`🎉 完成今日目標！連續 ${streak} 天`);
  checkBadges();
}

function checkBadges() {
  const stats = computeStats();
  const earned = BADGES.filter((b) => !STATE.daily.badges.includes(b.id) && b.test(stats, STATE.daily));
  if (earned.length) {
    STATE.daily = { ...STATE.daily, badges: [...STATE.daily.badges, ...earned.map((b) => b.id)] };
    saveDaily();
    showToast(`${earned[0].emoji} 獲得新貼紙：${earned[0].label}！`);
  }
}

function computeStats() {
  const byCat = {};
  CATEGORIES.forEach((c) => (byCat[c.key] = { total: 0, mastered: 0, weighted: 0, studied: 0 }));
  let masteredCount = 0, studiedCount = 0, weightedSum = 0;
  WORDS.forEach((w) => {
    const lv = (STATE.progress[w.id] || {}).level || 0;
    byCat[w.cat].total++;
    byCat[w.cat].weighted += lv;
    if (lv >= 4) { masteredCount++; byCat[w.cat].mastered++; }
    if (lv > 0) { studiedCount++; byCat[w.cat].studied++; }
    weightedSum += lv;
  });
  return {
    total: WORDS.length, masteredCount, masteredPct: WORDS.length ? masteredCount / WORDS.length : 0,
    studiedCount, avgLevel: WORDS.length ? weightedSum / WORDS.length : 0, byCat,
  };
}

/* ---------- shared: build a session queue that mixes unseen + weak + strong
   words, so a session never ends up only cycling "not familiar" repeats ---------- */
function buildWeightedQueue(pool, target) {
  target = Math.min(target, pool.length);
  const withLevel = pool.map((w) => ({ w, lv: (STATE.progress[w.id] || {}).level || 0 }));
  const unseen = shuffle(withLevel.filter((x) => x.lv === 0).map((x) => x.w));
  const weak = shuffle(withLevel.filter((x) => x.lv === 1 || x.lv === 2).map((x) => x.w));
  const strong = shuffle(withLevel.filter((x) => x.lv >= 3).map((x) => x.w));
  let queue = [];
  const take = (arr, n) => { const t = arr.splice(0, n); queue = queue.concat(t); };
  // roughly 60% of the session introduces new/unseen words, the rest reinforces weak ones
  take(unseen, Math.ceil(target * 0.6));
  take(weak, target - queue.length);
  take(unseen, target - queue.length);
  take(strong, target - queue.length);
  if (queue.length < target) {
    const used = new Set(queue.map((w) => w.id));
    const rest = shuffle(pool.filter((w) => !used.has(w.id)));
    queue = queue.concat(rest.slice(0, target - queue.length));
  }
  return shuffle(queue);
}

   ============================================================ */
function buildStudyQueue(cat) {
  const pool = cat === "all" ? WORDS : WORDS.filter((w) => w.cat === cat);
  return buildWeightedQueue(pool, 20);
}
if (STATE.study.queue.length === 0) STATE.study.queue = buildStudyQueue("all");

function restartStudy(cat) {
  STATE.study.cat = cat;
  STATE.study.queue = buildStudyQueue(cat);
  STATE.study.idx = 0;
  STATE.study.flipped = false;
  render();
}
function flipStudyCard() {
  STATE.study.flipped = !STATE.study.flipped;
  render();
}
function skipStudyCard() {
  STATE.study.idx++;
  STATE.study.flipped = false;
  render();
}
function rateStudyCard(level) {
  const word = STATE.study.queue[STATE.study.idx];
  updateWord(word.id, { level, seen: ((STATE.progress[word.id] || {}).seen || 0) + 1 });
  recordActivity(1);
  STATE.study.flipped = false;
  STATE.study.idx++;
  render();
}
function renderStudy() {
  const s = STATE.study;
  const done = s.idx >= s.queue.length;
  let inner = `<div class="pad">
    <div class="chipRow">
      ${catChipHtml(s.cat === "all", "全部", "🔀", "#233047", `restartStudy('all')`)}
      ${CATEGORIES.map((c) => catChipHtml(s.cat === c.key, c.label, c.emoji, c.color, `restartStudy('${c.key}')`)).join("")}
    </div>`;

  if (!done) {
    inner += `<div style="font-size:12px;font-weight:700;color:#8592A6;margin:12px 2px;">第 ${s.idx+1} / ${s.queue.length} 張 · 新單字與待加強單字混合出題</div>`;
  }

  if (done) {
    inner += `<div class="emptyWrap">
      <div style="font-size:44px;margin-bottom:8px;">🎉</div>
      <div style="font-weight:800;font-size:18px;margin-bottom:6px;">這組單字複習完成！</div>
      <div style="font-size:13px;color:#8592A6;margin-bottom:18px;">再抽一組卡片繼續加強熟悉度</div>
      <button class="cta" style="background:#4361EE;flex:none;padding:12px 26px;" onclick="restartStudy('${s.cat}')">🔄 再來一組</button>
    </div>`;
  } else {
    const word = s.queue[s.idx];
    const c = CAT_MAP[word.cat];
    const lv = (STATE.progress[word.id] || {}).level || 0;
    if (!s.flipped) {
      inner += `<div class="cardWrap"><div class="flashcard" style="background:linear-gradient(150deg, ${c.color}, ${c.color}CC);" onclick="flipStudyCard()">
        <div class="fcTab">${c.emoji} ${c.label}</div>
        <div class="fcPos">${word.pos}</div>
        <div class="fcEn">${word.en}</div>
        ${speakBtnHtml(word.en, 40, "#fff", "rgba(255,255,255,.28)")}
        <div class="fcHint">點卡片查看意思</div>
      </div></div>`;
      inner += `<div style="text-align:center;margin-top:18px;"><button style="background:none;color:#8592A6;font-weight:700;font-size:13px;" onclick="skipStudyCard()">跳過這張 →</button></div>`;
    } else {
      inner += `<div class="cardWrap"><div class="flashcard back" onclick="flipStudyCard()">
        <div class="fcTab" style="color:${c.color};background:${c.color}18;">${c.emoji} ${c.label}</div>
        <div class="fcPos" style="color:#8592A6;">${word.pos}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="fcEn" style="color:#233047;font-size:26px;">${word.en}</div>
          ${speakBtnHtml(word.en, 34)}
        </div>
        <div class="fcZh">${word.zh}</div>
        <div style="font-size:12px;color:#8592A6;margin-top:10px;">目前熟悉度：${levelInfo(lv).emoji} ${levelInfo(lv).label}</div>
      </div></div>`;
      inner += `<div class="rateRow">
        ${LEVELS.filter((l) => l.level > 0).map((l) => `<button class="rateBtn" style="background:${l.color};" onclick="rateStudyCard(${l.level})"><div style="font-size:20px;">${l.emoji}</div><div style="font-size:10.5px;font-weight:800;margin-top:2px;">${l.label}</div></button>`).join("")}
      </div>`;
    }
  }
  inner += `</div>`;
  return inner;
}

/* ============================================================
   QUIZ
   ============================================================ */
function buildQuizQuestions(cat) {
  let pool = cat === "all" ? WORDS : WORDS.filter((w) => w.cat === cat);
  if (pool.length < 4) pool = WORDS;
  const chosen = buildWeightedQueue(pool, QUIZ_LEN);
  return chosen.map((w) => {
    const distractors = shuffle(pool.filter((x) => x.id !== w.id)).slice(0, 3);
    const options = shuffle([w, ...distractors]);
    return { word: w, options };
  });
}
function startQuiz(cat) {
  STATE.quiz = { cat, phase: "playing", questions: buildQuizQuestions(cat), qi: 0, score: 0, streak: 0, picked: null, correctCount: 0 };
  render();
}
function chooseQuizOption(optId) {
  const qz = STATE.quiz;
  if (qz.picked) return;
  const q = qz.questions[qz.qi];
  const isCorrect = optId === q.word.id;
  qz.picked = optId;
  const curLv = (STATE.progress[q.word.id] || {}).level || 0;
  if (isCorrect) {
    const bonus = Math.min(qz.streak * 2, 10);
    qz.score += 10 + bonus;
    qz.streak += 1;
    qz.correctCount += 1;
    updateWord(q.word.id, { level: Math.min(4, curLv + 1), correct: ((STATE.progress[q.word.id] || {}).correct || 0) + 1 });
  } else {
    qz.streak = 0;
    updateWord(q.word.id, { level: Math.max(1, curLv - 1), wrong: ((STATE.progress[q.word.id] || {}).wrong || 0) + 1 });
  }
  recordActivity(1);
  render();
  setTimeout(() => {
    if (qz.qi + 1 >= qz.questions.length) {
      qz.phase = "done";
      if (qz.score > (STATE.hiScore.best || 0)) { STATE.hiScore = { best: qz.score }; saveHiScore(); }
    } else {
      qz.qi += 1;
      qz.picked = null;
    }
    render();
  }, 900);
}
function renderQuiz() {
  const qz = STATE.quiz;
  if (qz.phase === "setup") {
    return `<div class="pad">
      <div class="introCard">
        <div style="font-size:38px;">🎯</div>
        <div style="font-weight:800;font-size:18px;margin:8px 0 4px;">選出正確的中文意思</div>
        <div style="font-size:13px;color:#8592A6;">每題答對 +10 分，連續答對有額外加分。答錯會降低該單字熟悉度，答對則提升熟悉度。</div>
        <div style="font-size:12px;color:#8592A6;margin-top:10px;font-weight:700;">歷史最高分：${STATE.hiScore.best || 0}</div>
      </div>
      <div class="sectionTitle">選擇範圍</div>
      <div class="chipRow">
        ${catChipHtml(false, "全部", "🔀", "#233047", `startQuiz('all')`)}
        ${CATEGORIES.map((c) => catChipHtml(false, c.label, c.emoji, c.color, `startQuiz('${c.key}')`)).join("")}
      </div>
    </div>`;
  }
  if (qz.phase === "done") {
    const pct = Math.round((qz.correctCount / qz.questions.length) * 100);
    return `<div class="pad" style="text-align:center;">
      <div class="introCard">
        <div style="font-size:44px;">${pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "💪"}</div>
        <div style="font-weight:800;font-size:22px;margin:8px 0 4px;">得分 ${qz.score}</div>
        <div style="font-size:13px;color:#8592A6;">答對 ${qz.correctCount} / ${qz.questions.length}（${pct}%）</div>
        ${qz.score >= (STATE.hiScore.best || 0) && qz.score > 0 ? `<div style="margin-top:8px;color:#EF476F;font-weight:800;font-size:13px;">🎉 締造新紀錄！</div>` : ""}
      </div>
      <div class="ctaRow">
        <button class="cta" style="background:#4361EE;" onclick="startQuiz('${qz.cat}')">🔁 再測一次</button>
        <button class="cta" style="background:#8592A6;" onclick="STATE.quiz.phase='setup';render();">選擇其他範圍</button>
      </div>
    </div>`;
  }
  const q = qz.questions[qz.qi];
  const c = CAT_MAP[q.word.cat];
  return `<div class="pad">
    <div class="qzTopRow">
      <div class="qzPill">題目 ${qz.qi+1}/${qz.questions.length}</div>
      <div class="qzPill" style="background:#FFF4DA;color:#B7791F;">🔥 連續 ${qz.streak}</div>
      <div class="qzPill" style="background:#E9F7EF;color:#2E7D4F;">⭐ ${qz.score} 分</div>
    </div>
    <div class="qCard" style="background:linear-gradient(150deg, ${c.color}, ${c.color}CC);">
      <div style="font-size:11px;font-weight:800;opacity:.85;">${c.emoji} ${c.label} · ${q.word.pos}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;">
        <div style="font-weight:800;font-size:30px;">${q.word.en}</div>
        ${speakBtnHtml(q.word.en, 38, "#fff", "rgba(255,255,255,.28)")}
      </div>
      <div style="font-size:12px;opacity:.85;margin-top:6px;">這個字的中文意思是？</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px;">
      ${q.options.map((opt) => {
        let cls = "";
        if (qz.picked) {
          if (opt.id === q.word.id) cls = "correct";
          else if (qz.picked === opt.id) cls = "wrong";
        }
        return `<button class="qOption ${cls}" ${qz.picked ? "disabled" : ""} onclick="chooseQuizOption('${opt.id}')">${opt.zh}</button>`;
      }).join("")}
    </div>
  </div>`;
}

/* ============================================================
   SPELL (listen and type the word)
   ============================================================ */
const SPELL_LEN = 10;
function buildSpellQueue(cat) {
  const pool = cat === "all" ? WORDS : WORDS.filter((w) => w.cat === cat);
  return buildWeightedQueue(pool, SPELL_LEN);
}
function startSpell(cat) {
  STATE.spell = { cat, phase: "playing", queue: buildSpellQueue(cat), idx: 0, input: "", feedback: null, hintLevel: 0, score: 0, streak: 0, correctCount: 0 };
  render();
  const w = STATE.spell.queue[0];
  if (w) setTimeout(() => pronounce(w.en), 350);
}
function onSpellInput(val) {
  STATE.spell.input = val;
}
function onSpellKeydown(e) {
  if (e.key === "Enter") submitSpell();
}
function replaySpellWord() {
  const w = STATE.spell.queue[STATE.spell.idx];
  if (w) pronounce(w.en);
}
function normalizeSpelling(s) {
  return s
    .normalize("NFKC")
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}
function hintedBlanks(answer, hintLevel) {
  const totalLetters = (answer.match(/[a-zA-Z]/g) || []).length;
  const revealCount = hintLevel === 0 ? 0 : hintLevel === 1 ? 1 : Math.min(3, totalLetters);
  let count = 0, out = "";
  for (const ch of answer) {
    if (/[a-zA-Z]/.test(ch)) {
      count++;
      out += count <= revealCount ? ch : "＿";
    } else {
      out += ch;
    }
  }
  return out.split("").join(" ");
}
function resolveSpell(isCorrect) {
  const sp = STATE.spell;
  const w = sp.queue[sp.idx];
  sp.feedback = isCorrect ? "correct" : "wrong";
  const curLv = (STATE.progress[w.id] || {}).level || 0;
  if (isCorrect) {
    const bonus = Math.min(sp.streak * 2, 10);
    sp.score += 10 + bonus;
    sp.streak += 1;
    sp.correctCount += 1;
    updateWord(w.id, { level: Math.min(4, curLv + 1), correct: ((STATE.progress[w.id] || {}).correct || 0) + 1 });
  } else {
    sp.streak = 0;
    updateWord(w.id, { level: Math.max(1, curLv - 1), wrong: ((STATE.progress[w.id] || {}).wrong || 0) + 1 });
  }
  recordActivity(1);
  render();
  setTimeout(() => {
    if (sp.idx + 1 >= sp.queue.length) {
      sp.phase = "done";
    } else {
      sp.idx += 1;
      sp.input = "";
      sp.feedback = null;
      sp.hintLevel = 0;
      const nextW = sp.queue[sp.idx];
      if (nextW) setTimeout(() => pronounce(nextW.en), 300);
    }
    render();
    if (sp.phase === "playing") {
      const el = document.getElementById("spellInput");
      if (el) el.focus();
    }
  }, isCorrect ? 1100 : 2000);
}
function submitSpell() {
  const sp = STATE.spell;
  if (sp.feedback) return; // already answered, waiting to advance
  const w = sp.queue[sp.idx];
  const answer = normalizeSpelling(canonicalWord(w.en));
  const given = normalizeSpelling(sp.input || "");
  const isCorrect = given.length > 0 && given === answer;
  resolveSpell(isCorrect);
}
function hintSpell() {
  const sp = STATE.spell;
  if (sp.feedback) return;
  if (sp.hintLevel === 0) {
    sp.hintLevel = 1;
    render();
  } else if (sp.hintLevel === 1) {
    sp.hintLevel = 2;
    render();
  } else {
    // asked for a hint a 3rd time — treat as "I don't know" and mark it wrong
    resolveSpell(false);
    return;
  }
  const el = document.getElementById("spellInput");
  if (el) el.focus();
}
function skipSpell() {
  const sp = STATE.spell;
  if (sp.feedback) return;
  sp.streak = 0;
  if (sp.idx + 1 >= sp.queue.length) {
    sp.phase = "done";
  } else {
    sp.idx += 1;
    sp.input = "";
    sp.hintLevel = 0;
    const nextW = sp.queue[sp.idx];
    if (nextW) setTimeout(() => pronounce(nextW.en), 300);
  }
  render();
}
function renderSpell() {
  const sp = STATE.spell;
  if (sp.phase === "setup") {
    return `<div class="pad">
      <div class="introCard">
        <div style="font-size:38px;">✏️</div>
        <div style="font-weight:800;font-size:18px;margin:8px 0 4px;">聽發音，拼出這個字</div>
        <div style="font-size:13px;color:#8592A6;">每題會先唸出單字，聽完後在下面輸入拼法。答對加分、提升熟悉度；答錯會顯示正確答案並降低熟悉度。不會的話可以按「💡 提示」，最多兩次（第一次提示 1 個字母，第二次提示前面幾個字母）；第三次按提示會直接視為不會，記為答錯。</div>
      </div>
      <div class="sectionTitle">選擇範圍</div>
      <div class="chipRow">
        ${catChipHtml(false, "全部", "🔀", "#233047", `startSpell('all')`)}
        ${CATEGORIES.map((c) => catChipHtml(false, c.label, c.emoji, c.color, `startSpell('${c.key}')`)).join("")}
      </div>
    </div>`;
  }
  if (sp.phase === "done") {
    const pct = Math.round((sp.correctCount / sp.queue.length) * 100);
    return `<div class="pad" style="text-align:center;">
      <div class="introCard">
        <div style="font-size:44px;">${pct >= 80 ? "🏆" : pct >= 50 ? "👍" : "💪"}</div>
        <div style="font-weight:800;font-size:22px;margin:8px 0 4px;">得分 ${sp.score}</div>
        <div style="font-size:13px;color:#8592A6;">拼對 ${sp.correctCount} / ${sp.queue.length}（${pct}%）</div>
      </div>
      <div class="ctaRow">
        <button class="cta" style="background:#4361EE;" onclick="startSpell('${sp.cat}')">🔁 再拼一次</button>
        <button class="cta" style="background:#8592A6;" onclick="STATE.spell.phase='setup';render();">選擇其他範圍</button>
      </div>
    </div>`;
  }
  const w = sp.queue[sp.idx];
  const c = CAT_MAP[w.cat];
  const answer = canonicalWord(w.en);
  const blanks = hintedBlanks(answer, sp.hintLevel || 0);
  const fb = sp.feedback;
  return `<div class="pad">
    <div class="qzTopRow">
      <div class="qzPill">題目 ${sp.idx+1}/${sp.queue.length}</div>
      <div class="qzPill" style="background:#FFF4DA;color:#B7791F;">🔥 連續 ${sp.streak}</div>
      <div class="qzPill" style="background:#E9F7EF;color:#2E7D4F;">⭐ ${sp.score} 分</div>
    </div>
    <div class="qCard" style="background:linear-gradient(150deg, ${c.color}, ${c.color}CC);">
      <div style="font-size:11px;font-weight:800;opacity:.85;">${c.emoji} ${c.label} · ${w.pos} · ${w.zh}</div>
      <div style="margin-top:10px;">
        <button class="speakBtn" style="width:64px;height:64px;background:rgba(255,255,255,.25);color:#fff;font-size:30px;" onclick="replaySpellWord()" aria-label="重播發音">🔊</button>
      </div>
      <div style="font-size:20px;letter-spacing:3px;margin-top:12px;font-weight:800;opacity:.85;">${fb ? answer : blanks}</div>
      <div style="font-size:11px;opacity:.8;margin-top:4px;">點喇叭聽發音，再輸入拼法</div>
    </div>

    <input id="spellInput" autocapitalize="off" autocorrect="off" spellcheck="false"
      value="${escapeHtml(sp.input)}"
      oninput="onSpellInput(this.value)" onkeydown="onSpellKeydown(event)"
      placeholder="輸入英文拼法…" class="search"
      style="text-align:center;font-size:18px;font-weight:800;margin-top:16px;${fb === "correct" ? "border-color:#06D6A0;color:#177350;" : fb === "wrong" ? "border-color:#EF476F;color:#B3223F;" : ""}"
      ${fb ? "disabled" : ""}/>

    ${fb === "correct" ? `<div style="text-align:center;color:#06D6A0;font-weight:800;font-size:14px;margin-top:8px;">✅ 答對了！</div>` : ""}
    ${fb === "wrong" ? `<div style="text-align:center;color:#EF476F;font-weight:800;font-size:14px;margin-top:8px;">❌ 正確答案是：${answer}</div>` : ""}

    ${!fb ? `<div style="display:flex;gap:10px;margin-top:14px;">
      <button class="cta" style="background:#4361EE;" onclick="submitSpell()">✓ 送出答案</button>
      <button class="cta" style="background:#8592A6;flex:none;padding:13px 18px;" onclick="skipSpell()">跳過</button>
    </div>
    <div style="margin-top:10px;">
      <button class="cta" style="background:#FFB703;width:100%;" onclick="hintSpell()">💡 提示${sp.hintLevel > 0 ? `（已用 ${sp.hintLevel}/2，再按一次視為不會）` : ""}</button>
    </div>` : ""}
  </div>`;
}

function bodyHtml() {
  if (STATE.tab === "home") return renderHome();
  if (STATE.tab === "browse") return renderBrowse();
  if (STATE.tab === "study") return renderStudy();
  if (STATE.tab === "spell") return renderSpell();
  if (STATE.tab === "quiz") return renderQuiz();
  return "";
}
function render() {
  const root = document.getElementById("app");
  root.innerHTML = `
    ${headerHtml()}
    <div class="body">${bodyHtml()}</div>
    ${tabBarHtml()}
    <div id="toastHost">${STATE.toast ? `<div class="toast">${escapeHtml(STATE.toast)}</div>` : ""}</div>
  `;
  if (STATE.tab === "browse") updateBrowseList();
}

// load voices ahead of time (some browsers populate this list async);
// clear the cached choice so pickBestVoice() re-evaluates once the full list is in
if ("speechSynthesis" in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    cachedVoice = null;
    window.speechSynthesis.getVoices();
  };
}

render();
</script>
</body>
</html>
