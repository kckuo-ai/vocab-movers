<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs>
<clipPath id="c"><rect x="4" y="4" width="120" height="120" rx="14"/></clipPath>
<!-- deep blue at the top, lighter near the horizon -->
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1565C0"/><stop offset=".55" stop-color="#42A5F5"/><stop offset="1" stop-color="#B3E5FC"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="128" height="128" fill="url(#sky)"/>
<!-- a few birds far away, to show how big and open the sky is -->
<g fill="none" stroke="#0D47A1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M34,40 q5,-5 9,0 q4,-5 9,0"/><path d="M60,28 q4,-4 7,0 q3,-4 7,0"/><path d="M86,50 q3.5,-3.5 6,0 q2.5,-3.5 6,0"/>
</g>
<!-- low hills and a small tree line at the bottom edge -->
<path d="M0,108 Q30,98 60,104 Q92,110 128,100 V128 H0 Z" fill="#7CB342"/>
<path d="M0,116 Q40,108 80,114 Q108,118 128,112 V128 H0 Z" fill="#558B2F"/>
<circle cx="20" cy="102" r="5" fill="#33691E"/><circle cx="27" cy="104" r="4" fill="#33691E"/><circle cx="104" cy="99" r="5" fill="#33691E"/><circle cx="111" cy="101" r="4" fill="#33691E"/>
</g>
</svg>
